# 여행 기본 정보. 폴더 이름(taipei-2026)이 주소가 됩니다: #/taipei-2026
title: 타이베이 3박 4일
country: tw              # content/countries/tw.yaml
city: 타이베이
route: ICN → TPE
start: "2026-10-07"
end: "2026-10-10"
summary: 101 야경, 예스폭지 버스투어, 고궁박물원

hotel:
  place: hotel           # places.yaml의 id
  access: 룽산쓰역{BL10}에서 걸어서 3분, 완화역과 바로 붙어 있어요.
  nights: 3

# 이 여행에만 해당하는 현지 정보. 나라 공통 정보보다 먼저 보여요.
info:
  - title: 날씨
    body: 10월 초에는 낮 27–30°C, 밤 22–24°C 정도예요. 습하고 소나기가 자주 오니 가벼운 우비를 챙기세요. 태풍 시즌 끝자락이라 출발 2–3일 전에 예보를 한 번 확인해 주세요.
  - title: 10월 10일 쌍십절
    body: 중화민국 국경일이에요. 총통부 주변 교통이 통제되고 관광지가 붐비며, 은행과 관공서는 문을 닫아요.

# 나라 공통 앱 목록 뒤에 더할 앱
apps:
  - group: 지도 · 교통
    name: 台北捷運Go
    store: 타이베이 메트로 공식 앱
    ios: "997212021"
    desc: 노선도와 역별 출구 안내, 열차 도착 시간, 요금을 한눈에 볼 수 있어요. 메인역처럼 출구가 많은 역에서 특히 유용하고, 영어로도 볼 수 있어요.

footer: 2026년 10월 6일 기준으로 정리했어요. 가격이나 영업시간, 전시 정보는 바뀔 수 있으니 방문 전에 공식 채널에서 한 번 더 확인해 주세요. Day 2 시간표는 투어사 안내를 따랐어요.
