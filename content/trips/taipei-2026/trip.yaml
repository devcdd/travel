# 여행 기본 정보. 폴더 이름(taipei-2026)이 주소가 됩니다: #/taipei-2026
title: 타이베이 3박 4일
country: tw              # content/countries/tw.yaml
city: 타이베이
route: PUS → TPE
start: "2026-10-07"
end: "2026-10-10"
summary: 101 야경, 예스폭지 버스투어, 고궁박물원

hotel:
  place: hotel           # places.yaml의 id
  access: 룽산쓰역{BL10}에서 걸어서 3분, 완화역과 바로 붙어 있어요.
  nights: 3

# 예매해 둔 티켓과 미리 끝낸 일. "예매" 탭에 날짜 순서로 보여요. 예약번호는 적지 않아요.
tickets:
  - title: 대만 온라인 입국신고서
    date: "2026-10-07"
    status: 작성 완료
    done: true
    points:
      - 작성을 마쳤어요. 작성할 때 적은 이메일로 확인 메일이 왔는지 출발 전에 한 번 확인해 두세요.
  - title: 타이베이 101 전망대 89층 일반권
    date: "2026-10-07"
    status: 예매 완료
    done: true
    facts:
      - label: 티켓
        value: 89층 일반권 3장
      - label: 입장 시간
        value: 16:30–17:00 사이
    points:
      - 16:20쯤 딘타이펑 번호표를 받고 바로 올라가면 입장 시간에 딱 맞아요. 17:00이 넘으면 들어갈 수 없으니 늦지 않게 가세요.
      - 101층까지 올라가고 싶으면 현장에서 NT$380을 더 내면 돼요.
  - title: 예스폭지 버스투어 (착한투어)
    date: "2026-10-08"
    status: 예매 완료
    done: true
    facts:
      - label: 미팅
        value: 11:40 시먼역 5번 출구 지상, 또는 12:10 메인역 M3 출구 지하 1층 에스컬레이터 앞
      - label: 확인 방법
        value: 바우처 없이 가이드에게 한글 이름과 전화번호를 말해요
      - label: 비상 연락
        value: +886 987 770 987
    points:
      - 미팅 장소는 두 곳 중 편한 곳을 고르면 되고, 투어사에 따로 알릴 필요는 없어요. 숙소에서는 시먼역이 가까워요.
      - 예류 입장료 NT$120과 천등 값은 투어에 포함되지 않아서 현금으로 따로 챙기세요.
  - title: 국립고궁박물원 입장권
    date: "2026-10-09"
    status: 예매 완료
    done: true
    facts:
      - label: 티켓
        value: PDF 파일로 따로 갖고 있어요
    points:
      - 입구에서 PDF 티켓을 보여 주세요. 휴대폰에 미리 저장해 두면 인터넷이 안 될 때도 열 수 있어요.
  - title: 고궁박물원 한국어 오디오 가이드
    date: "2026-10-09"
    status: 현장 결제
    done: false
    points:
      - 미리 사지 않았어요. 1층 대여 창구에서 결제하고 빌리면 돼요.

# 이 여행에만 해당하는 현지 정보. 나라 공통 정보보다 먼저 보여요.
info:
  - group: 이번 여행
    title: 날씨 (10월 6일 예보)
    points:
      - 대만 기상청이 10월 6일 아침에 낸 타이베이 예보예요. 7일과 8일은 구름이 많거나 흐리고, 낮 최고 기온은 27–29°C예요. 비 소식은 거의 없어요.
      - 9일과 10일은 낮 최고 29–30°C에 짧은 소나기가 지나갈 수 있어요. 접이식 우산이나 가벼운 우비를 가방에 넣어 다니세요.
      - 아침저녁에도 23–25°C라 반팔로 지내기 좋아요. 북동 계절풍이 불어서 바닷가나 산 위는 바람이 셀 수 있으니 얇은 겉옷을 하나 챙기세요.
      - 8일 투어 날 지우펀이 있는 루이팡 지역은 비 올 확률이 20% 정도예요. 다만 산 위라 안개와 이슬비가 잦으니 우비는 꼭 가져가세요.
      - 먼 바다에 태풍이 있지만 대만 쪽으로 오지 않아서 이번 여행에는 영향이 없을 거라고 해요.
      - 날짜별 탭의 날씨 칸은 Open-Meteo 예보를 그때그때 새로 불러와요.
  - group: 이번 여행
    title: 국경일 연휴 (10월 9–11일)
    body: 10월 10일 쌍십절이 토요일이라 9일 금요일이 대체휴일이에요. 연휴 내내 관광지와 식당, 공항이 붐벼요. 10일 0시부터 13시까지는 총통부와 타이베이역 남쪽 도로에 차량 통제가 있으니 MRT로 다니세요.
  - group: 투어 쿠폰북
    title: 착한투어 제휴 쿠폰북
    points:
      - 투어 날 미팅 장소에서 가이드가 알려 주는 **버스 번호**를 가게에 보여 주면 할인을 받을 수 있어요. 버스 번호를 사진으로 찍어 두세요.
      - 지우펀에서는 수신방(手信坊) 펑리수가 5% 할인되고, 행복당(幸福堂) 흑당 버블티는 NT$5를 깎아 줘요. 미스티(Misty) 누가 크래커는 5개를 사면 1개를 더 줘요.
      - 지우펀 찻집 세 곳, 정영(定迎)과 차차(察茶), 산해방(Sunrise Teahouse)도 할인이나 행사를 해요. 아메이차루 대신 앉아서 차를 마시고 싶을 때 들러 보세요.
      - 스펀에서는 땅콩 아이스크림 가게와 버블티 음료 가게에서 NT$5씩 깎아 줘요.
      - 시먼딩에서는 우산 가게 우산왕(雨傘王)이 10%, 근무문(筋武門) 마사지 1·2호점이 5% 할인이고, 동대문 한식당(東大門 韓國特色料理 西門店)은 NT$250짜리 소주 한 병을 무료로 줘요.
      - 메인역 근처 승지도 마사지도 5% 할인돼요.
      - 2024년 8월에 올라온 쿠폰북이라 지금도 되는지는 계산 전에 가게에 먼저 물어보세요. 진과스의 야미 펑리수는 이번 투어 코스에 없어요.
  - group: 돈과 결제
    title: 이지카드는 얼마 충전할까
    points:
      - 카드값 NT$100에 더해 **1인 NT$500**을 충전하면 이번 일정의 MRT와 버스 요금이 거의 해결돼요.
      - 공항철도가 편도 NT$160이라 오갈 때만 NT$320이 들고, 나머지는 시내 MRT와 버스 몇 번이면 돼요.
      - 편의점에서 사는 것이나 택시비까지 이지카드로 낼 생각이라면 NT$200–300을 더 넣어 두세요.
      - 잔액이 모자라면 MRT역이나 편의점에서 언제든 현금으로 채울 수 있으니 처음부터 많이 넣을 필요는 없어요.

# 나라 공통 앱 목록 뒤에 더할 앱
apps:
  - group: 지도 · 교통
    name: 台北捷運Go
    store: 타이베이 메트로 공식 앱
    ios: "997212021"
    desc: 노선도와 역별 출구 안내, 열차 도착 시간, 요금을 한눈에 볼 수 있어요. 메인역처럼 출구가 많은 역에서 특히 유용하고, 영어로도 볼 수 있어요.

# 항공편과 숙소 예약 정보. "항공·숙소" 탭에 보여요. 예약번호, PIN은 적지 않아요.
flights:
  - label: 가는 편
    date: "2026-10-07"
    airline: 대한항공
    flight: KE2085
    from: { airport: 부산 김해, time: "09:00", terminal: 국제선 }
    to: { airport: 타이베이 타오위안, time: "10:30", terminal: 1터미널 }
    duration: 2시간 30분
    tips:
      - 타이베이는 한국보다 1시간 늦어요. 도착 시각 10:30은 타이베이 시각이에요.
      - 위탁 수하물 허용량은 예약 확인 링크에서 한 번 확인해 두세요.
  - label: 오는 편
    date: "2026-10-10"
    airline: 타이거항공 타이완
    flight: IT606
    from: { airport: 타이베이 타오위안, time: "16:40", terminal: 1터미널 }
    to: { airport: 부산 김해, time: "19:55", terminal: 국제선 }
    duration: 2시간 15분
    tips:
      - 온라인 체크인은 출발 48시간 전인 10월 8일 16:40부터 할 수 있어요.
      - 체크인 카운터는 14:10에 열고 15:55에 닫아요. 연휴라 줄이 길 수 있으니 일찍 가세요.
      - 타이베이역 A1 도심 공항 체크인은 쓸 수 없어서 공항 1터미널에서 체크인해야 해요.
      - 저비용 항공사라 위탁 수하물이 요금에 들어 있는지 꼭 확인하세요.

stay:
  - label: 예약
    value: 트립닷컴에서 온라인으로 미리 결제했어요.
  - label: 객실
    value: 객실 1개에 3박이에요.
  - label: 체크인
    value: 10월 7일 15:00부터 자정까지 할 수 있어요.
  - label: 조식
    value: 3명 모두 조식이 포함돼 있어요.
