# 이 여행의 예약·준비 체크리스트. 나라 공통 항목(countries/tw.yaml)이 뒤에 붙어요.
# group이 같은 항목끼리 묶이고, 묶음은 처음 나온 순서대로 보여요.
# id는 체크 상태를 저장하는 키라서 한번 정하면 바꾸지 마세요.
- id: c-baggage
  title: 항공 수하물 규정 확인
  desc: 예약 확인 링크에서 대한항공과 타이거항공의 수하물 허용량을 확인하세요. 타이거항공은 저비용 항공사라 위탁 수하물이 요금에 포함됐는지 꼭 확인하세요.
  due: 출발 전
  group: 출발 전에 할 일
- id: c-rain
  title: 우비와 운동화
  desc: 지우펀 계단과 샹산 등산로를 걸어야 하고, 10월에도 소나기가 자주 와요.
  due: 출발 전
  group: 짐 챙기기
- id: c-meds
  title: 상비약과 멀미약
  desc: 둘째 날 투어는 굽은 산길을 버스로 오래 달려요. 멀미를 하는 분은 멀미약을 챙기고, 소화제와 진통제도 함께 넣어 두세요.
  due: 출발 전
  group: 짐 챙기기
- id: c-jiayan
  title: 첫날 딤섬 점심 예약 (선택)
  desc: 숙소 3층 자옌(家宴)에서 드실 거라면 TableCheck나 전화(02-2383-6798)로 12:15에 3명 자리를 예약해 두세요.
  due: "10.07"
  group: 예약과 티켓
- id: c-101
  title: 101 전망대 티켓
  desc: 89층 일반권 3장을 예매했어요. 입장은 10월 7일 16:30–17:00 사이예요.
  due: "10.07"
  group: 예약과 티켓
- id: c-tour
  title: 예스폭지 투어 준비
  desc: 착한투어 12시 20분 출발 예스폭지예요. 바우처는 없고 미팅 장소에서 한글 이름을 말하면 돼요. 카카오톡의 '전화번호로 친구 추가 허용'을 켜 두고, 예류 입장료 NT$120과 천등 값은 현금으로 따로 챙기세요.
  due: "10.08"
  group: 예약과 티켓
- id: c-npm
  title: 고궁박물원 티켓
  desc: 입장권을 예매해서 PDF로 갖고 있어요. 한국어 오디오 가이드는 현장에서 결제해요.
  due: "10.09"
  group: 예약과 티켓
- id: c-hotpot
  title: 훠궈 예약
  desc: inline에서 10월 9일(대체휴일) 18:00, 3명 자리를 우라오 시먼딩점에 예약하세요. 점심을 다오서에서 드신다면 전화로 함께 예약해 두면 좋아요.
  due: "10.09"
  group: 예약과 티켓
- id: c-online-checkin
  title: 타이거항공 온라인 체크인
  desc: 출발 48시간 전인 10월 8일 16:40부터 할 수 있어요. 미리 해 두면 공항에서는 짐만 부치면 돼요.
  due: "10.08"
  group: 여행 중에
