# 하루 일정. 파일 이름 순서가 Day 1, 2, 3 … 이고, 주소는 #/taipei-2026/d1 처럼 돼요.
# stops: kind(meet 집합 · sight 관광 · food 식사 · free 자유) 또는 move(이동 안내 한 줄)
date: "2026-10-08"
short: 투어
title: 예스폭지 한국어 가이드 버스투어
lead: 예류, 스펀폭포, 스펀, 지우펀을 버스로 하루에 도는 투어예요. 숙소에서 시먼역까지 한 정거장이라 1차 미팅 장소(시먼 11:40)를 이용하시는 게 가장 편해요. 투어 중에는 식사 시간이 따로 없으니 점심은 출발 전에 시먼딩에서 드시고, 저녁은 지우펀에서 간식으로 해결하세요.
chips:
  - tone: ok
    text: 확정
  - tone: warn
    text: 미팅 시간 엄수
facts:
  - label: 집합
    value: 11:40 시먼(추천), 12:10 메인역
  - label: 해산
    value: 21:10 이후
  - label: 챙길 것
    value: 우비, 운동화, 동전
weather:
  place: jiufen
  label: 지우펀
links:
  - label: KKday 상품
    href: https://www.kkday.com/ko/product/32489
  - label: Klook 상품
    href: https://www.klook.com/ko/activity/213487-taipei-bustour/
stops:
  - time: "08:00"
    kind: food
    label: 조식
    title: 호텔 조식
    place: hotel
    meta:
      - 5층 百宴 Metro Buffet
      - 06:30–10:00
    desc: 3명 모두 조식이 포함돼 있어요. 8:30–9:30이 가장 붐비니 그 전에 드시고, 투어 중에는 식사 시간이 따로 없으니 든든하게 드세요.
  - time: "10:20"
    move: 룽산쓰역{BL10}에서 한 정거장만 가면 시먼역{BL11}이에요. 걸어가도 15분이면 충분해요.
  - time: "10:40"
    kind: food
    label: 점심
    title: 아종면선
    local: 阿宗麵線
    place: aychung
    meta:
      - "{BL11} 시먼역 6번 출구 근처"
    desc: 가다랑어 육수에 곱창을 넣어 걸쭉하게 끓인 대만식 국수예요. 서서 먹는 집이라 10분이면 다 먹을 수 있어서 미팅 전에 들르기 딱 좋아요. 조식을 든든히 먹었다면 작은 그릇(小)으로 충분해요. 근처에서 버블티도 하나 사 가세요.
  - time: "11:40"
    kind: meet
    label: 1차 집합 · 추천
    title: 시먼역 5번 출구
    place: ximen5
    meta:
      - 지상 1층 출구 앞
      - "{BL11} {G12}"
    desc: 숙소에서 가장 가까운 미팅 장소예요. 10분 전까지 도착해 주세요.
  - time: "12:10"
    kind: meet
    label: 2차 집합
    title: 타이베이 메인역 M3 출구
    place: tmsM3
    meta:
      - 지하 1층 에스컬레이터 앞
      - "{R10} {BL12}"
    desc: 1차 미팅을 놓쳤을 때 이용하세요. 메인역 지하는 출구가 많아 헷갈리기 쉬우니 M3 표지판을 따라 넉넉하게 움직이세요.
    offRoute: true
  - time: "12:20"
    move: 메인역에서 출발해 북부 해안을 따라 버스로 1시간쯤 달려요.
  - time: "13:20"
    kind: sight
    title: 예류지질공원
    place: yehliu
    meta:
      - 1시간 10분 머물러요
      - 14:30 출발
    desc: 바닷바람과 파도가 오랜 세월 깎아 만든 버섯 모양 바위들이 늘어선 해안이에요. 대표 바위인 여왕머리는 풍화로 목이 점점 가늘어지고 있어요.
    tips:
      - "**여왕머리(女王頭)** 앞은 사진 줄이 길어요. 입장하면 가장 안쪽의 여왕머리부터 보고, 돌아 나오면서 버섯바위와 촛대바위를 구경하세요."
      - 그늘이 거의 없으니 모자와 선크림, 물을 챙기세요.
      - 바위 주변 빨간 선 밖으로는 나가면 안 돼요. 입장료(약 NT$120)가 투어에 포함됐는지도 바우처에서 미리 확인해 두세요.
    tour: true
  - time: "14:30"
    move: 핑시 산길을 따라 버스로 50분쯤 이동해요.
  - time: "15:20"
    kind: sight
    title: 스펀폭포
    place: shifenFall
    meta:
      - 50분 머물러요
      - 16:10 출발
    desc: 폭이 40m로 대만에서 가장 넓은 커튼형 폭포라 ‘대만의 나이아가라’라고 불려요. 주차장에서 흔들다리를 건너 숲길을 10–15분 걸어 들어가요.
    tips:
      - 오후에 해가 나면 폭포 앞에 무지개가 자주 떠요. 전망 데크 정면에서 사진을 찍어 보세요.
      - 오가는 시간을 빼면 폭포 앞에 머무는 시간은 20분 정도예요. 사진부터 찍고 여유 있게 구경하세요.
    tour: true
  - time: "16:10"
    move: 버스로 10분이면 도착해요.
  - time: "16:20"
    kind: sight
    title: 스펀에서 천등 날리기
    local: 十分老街 · 天燈
    place: shifen
    meta:
      - 1시간 머물러요
      - 17:20 출발
    desc: 핑시선 기찻길 위에서 소원을 적은 천등을 날리는 마을이에요. 실제로 기차가 다니는 선로라 기적 소리가 들리면 양옆으로 비켜 주세요.
    tips:
      - 천등은 단색이 NT$200 안팎, 4색이 NT$250–300 정도예요. 빨강은 건강, 노랑은 재물, 분홍은 사랑처럼 색마다 뜻이 있으니 네 면에 소원을 나눠 적어 보세요. 날릴 때는 가게 직원이 사진과 영상을 찍어 줘요.
      - 출출하면 **닭날개볶음밥(雞翅包飯)**을 드셔 보세요. 뼈를 발라낸 닭날개 속에 볶음밥을 채운 스펀 명물이에요.
    tour: true
  - time: "17:20"
    move: 버스로 50분쯤 가요. 굽은 산길이라 멀미가 걱정되면 미리 약을 챙기세요.
  - time: "18:10"
    kind: sight
    label: 관광 · 저녁
    title: 지우펀
    local: 九份
    place: jiufen
    meta:
      - 2시간 머물러요
      - 20:10 출발
    desc: 해가 진 직후에 도착해서 홍등이 막 켜진 거리를 걷게 돼요. 먹거리 골목인 지산제(基山街)로 들어가서 수치루(豎崎路) 계단으로 내려오는 순서로 둘러보세요.
    tips:
      - 지우펀을 대표하는 야경은 **아메이차루(阿妹茶樓)**예요. 건물 정면 사진은 맞은편 계단 위에서 찍으세요. 안에서 차를 마시면 1인 찻값과 다과 비용이 따로 들어요.
      - 저녁은 간식으로 해결하세요. 아간이 위위안(阿柑姨芋圓)의 따뜻한 타로볼, 땅콩 아이스크림 롤(花生捲冰淇淋), 어묵탕이 유명해요.
      - 골목이 좁고 사람이 많아요. 버스 위치와 **20:10 출발 시간**을 가이드에게 한 번 더 확인하고, 계단이 미끄러우니 운동화를 신으세요.
      - 산간 지역이라 비와 안개가 잦아요. 우산보다는 우비가 훨씬 편해요.
    tour: true
  - time: "20:10"
    move: 버스로 1시간쯤 달려 시내로 돌아와요.
  - time: "21:10"
    kind: free
    label: 해산
    title: 내릴 곳 고르기
    meta:
      - 라오허제, 메인역, 시먼역 중에서 골라요
    alts:
      - title: 시먼역 · 추천
        local: 西門站
        place: ximen5
        desc: 시먼역{BL11}에서 숙소가 있는 룽산쓰역{BL10}까지 한 정거장이라 가장 빨리 쉴 수 있어요.
      - title: 라오허제 야시장
        local: 饒河街夜市
        place: raohe
        desc: 자정 무렵까지 열어요. 입구에 있는 **푸저우 세조 후추빵(福州世祖胡椒餅)**은 줄을 서서라도 먹어 볼 만해요. 돌아올 때는 쑹산역{G19}에서 그린라인을 타면 갈아타지 않고 시먼역{G12}까지 가고, 블루라인으로 한 정거장만 더 가면 돼요. 35분쯤 걸려요.
      - title: 타이베이 메인역
        local: 台北車站
        place: tmsM3
        desc: 메인역{BL12}에서 블루라인으로 두 정거장 가면 숙소예요.
