# 하루 일정. 파일 이름 순서가 Day 1, 2, 3 … 이고, 주소는 #/taipei-2026/d1 처럼 돼요.
# stops: kind(meet 집합 · sight 관광 · food 식사 · free 자유) 또는 move(이동 안내 한 줄)
date: "2026-10-10"
short: 귀국
title: 숙소 근처 산책, 우육면 먹고 공항으로
lead: 10월 10일은 중화민국 국경일(쌍십절)이에요. 오전에 숙소에서 멀지 않은 총통부 앞에서 기념식이 열려 주변 도로가 통제되니, 이날은 택시보다 MRT로 다니세요. 귀국편 시간을 아직 몰라서 오후 이후 출발을 기준으로 일정을 짰어요. 오전 비행기라면 체크아웃 후 바로 공항으로 가세요.
chips:
  - tone: idea
    text: 제안
  - tone: warn
    text: 쌍십절
  - tone: warn
    text: 항공편 확인
facts:
  - label: 지역
    value: 완화, 둥먼
  - label: 공항까지
    value: 숙소에서 1시간 남짓
stops:
  - time: "08:00"
    kind: sight
    title: 룽산쓰 아침 참배
    place: longshan
    meta:
      - 숙소에서 걸어서 5분
      - 06:00부터 열어요
    desc: 아침 향 연기 속에서 현지인들이 기도하는 모습을 볼 수 있어요. 반달 모양 나무 조각 두 개(筊杯)를 던져 신에게 답을 묻는 대만식 점괘도 구경해 보세요.
  - time: "09:00"
    kind: sight
    title: 보피랴오 역사거리
    place: bopiliao
    meta:
      - 숙소에서 걸어서 5분
      - 30분 정도
    desc: 청나라부터 일제강점기까지의 붉은 벽돌 건물이 그대로 남아 있는 골목이에요. 영화 ‘艋舺(Monga)’의 촬영지로도 유명해요.
  - time: "10:20"
    move: 룽산쓰역{BL10}에서 메인역{BL12}까지 간 뒤 레드라인으로 갈아타 둥먼역{R07}에서 내리세요. 20분쯤 걸려요.
  - time: "10:50"
    kind: food
    label: 이른 점심
    title: 융캉 우육면
    place: yongkang
    meta:
      - "{R07} {O06} 둥먼역에서 걸어서 5분"
      - 11:00에 문 열어요
    desc: 1963년부터 이어 온 홍샤오(紅燒) 우육면 맛집이에요. 진하게 졸인 간장 육수에 큼직한 소고기 사태가 들어가요. 문 열기 10분 전에 도착하면 기다리지 않고 바로 앉을 수 있어요.
    tips:
      - 홍샤오 우육면(紅燒牛肉麵)과 함께, 쌀가루를 묻혀 찐 갈비 분증배골(粉蒸排骨)도 곁들여 보세요.
  - time: "12:00"
    kind: sight
    title: 융캉제 산책
    place: yongkangSt
    meta:
      - 1시간 정도
    desc: 찻집과 소품 가게, 디저트 가게가 모여 있는 아담한 거리예요. 스무시(思慕昔)에서 망고빙수로 후식을 드시고, 차를 사 가실 거라면 여기서 시음해 보고 고르세요.
  - time: "13:30"
    kind: food
    label: 기념품
    title: 펑리수와 간식 사기
    local: 鳳梨酥
    alts:
      - title: 까르푸 구이린점
        place: carrefour
        desc: 숙소에서 걸어갈 수 있는 24시간 대형 마트예요. 펑리수, 누가 크래커, 차 티백, 컵라면까지 기념품을 한 번에 살 수 있어요.
      - title: 치아더
        place: chiate
        desc: 난징싼민역{G17} 근처에 있는 펑리수 맛집이에요. 크랜베리 맛도 인기가 많아요. 동선에서 조금 벗어나니 시간이 넉넉할 때만 다녀오세요.
  - time: "14:30"
    kind: free
    label: 체크아웃
    title: 숙소에서 짐 찾기
    place: hotel
    desc: 맡겨 둔 짐을 찾고 공항으로 출발할 준비를 하세요.
  - time: 출발 3시간 전
    kind: meet
    label: 공항 이동
    title: 타오위안 공항
    place: airport
    meta:
      - "{BL10} → {BL12} → {A1} → {A12} 1터미널 / {A13} 2터미널"
    desc: 룽산쓰역에서 메인역까지 두 정거장 간 다음, 메인역 A1에서 보라색 공항철도 직달차(直達車)를 타면 35분쯤 걸려요. 요금은 NT$150이고, 숙소에서 공항까지 1시간 남짓 잡으시면 돼요.
    tips:
      - 일반차는 서는 역이 많아 50분 넘게 걸려요. 열차 색깔과 ‘直達’ 표시를 확인하고 타세요.
      - A1역의 **도심 공항 체크인**을 이용하면 짐을 미리 부치고 가볍게 다닐 수 있어요. 이용할 수 있는 항공사와 마감 시간은 미리 확인하세요.
