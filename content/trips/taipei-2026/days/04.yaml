# 하루 일정. 파일 이름 순서가 Day 1, 2, 3 … 이고, 주소는 #/taipei-2026/d4 처럼 돼요.
# stops: kind(meet 집합 · sight 관광 · food 식사 · free 자유) 또는 move(이동 안내 한 줄)
date: "2026-10-10"
short: 귀국
title: 기념품 사고 우육면 먹고 공항으로
lead: 비행기가 16:40이라 오전에만 여유가 있어요. 조식을 먹고 기념품을 산 뒤, 짐을 맡겨 두고 시먼에서 우육면으로 점심을 먹고 12시 무렵 공항으로 출발해요. 10월 10일은 국경일(쌍십절)이고 9일부터 11일까지 연휴라 공항이 붐빌 수 있어요. 오전에는 총통부와 타이베이역 남쪽 도로에 차량 통제가 있으니 택시보다 MRT로 다니세요.
chips:
  - tone: ok
    text: 항공편 확정
  - tone: warn
    text: 쌍십절 연휴
facts:
  - label: 출국
    value: 16:40 타이거항공 IT606 · 1터미널
  - label: 공항 도착
    value: 13:30 무렵
  - label: 체크인 카운터
    value: 14:10–15:55
stops:
  - time: "07:30"
    kind: food
    label: 조식
    title: 호텔 조식
    place: hotel
    meta:
      - 5층 百宴 Metro Buffet
      - 06:30–10:00
    desc: 3명 모두 조식이 포함돼 있어요. 8:30–9:30이 가장 붐비니 그 전에 드세요.
  - time: "09:00"
    kind: food
    label: 기념품
    title: 까르푸 구이린점에서 기념품 사기
    place: carrefour
    meta:
      - "{BL11} 시먼역에서 걸어서 5분"
      - 24시간 영업
    desc: 펑리수, 누가 크래커, 차 티백, 컵라면까지 기념품을 한 번에 살 수 있는 대형 마트예요. 짐이 늘어나니 캐리어 무게를 생각하며 담으세요.
  - time: "10:45"
    kind: free
    label: 체크아웃
    title: 체크아웃하고 짐 맡기기
    place: hotel
    desc: 체크아웃은 12:00까지예요. 짐을 싸서 체크아웃한 뒤 프런트에 캐리어를 맡겨 두면, 점심을 가볍게 다녀올 수 있어요. 체크아웃 후에도 짐을 맡아 줘요.
  - time: "11:00"
    kind: food
    label: 점심
    title: 우육면 점심
    local: 牛肉麵
    alts:
      - title: 라오산둥 · 시먼 · 추천
        place: laoShandong
        desc: 2026년 미쉐린 빕구르망에 오른 우육면집으로, 가게 이름처럼 직접 만든 면(家常麵)을 써요. 시먼역{BL11}에서 가깝고 숙소와 메인역 사이라 이날 동선에 딱 맞아요.
        tips:
          - 미쉐린 기준 매일 10:30–21:30 열고, 현금만 받으며 예약은 안 돼요. 건물 지하 1층에 있어요.
      - title: 류산둥 · 메인역 근처
        place: liuShandong
        desc: 메인역 근처 골목의 오래된 우육면집이에요. 홍샤오(紅燒)와 칭둔(清燉) 우육면이 각각 NT$220이에요. 가게가 좁고 줄이 길지만 회전은 빨라요.
        tips:
          - 월–토 08:00–18:00 열고 일요일에 쉬어요. 국경일 당일에도 여는지는 확인하지 못했어요. 현금만 받아요.
          - 이날 오전에는 가게 주변이 차량 통제 구역이라 걸어서 가셔야 해요.
  - time: "12:00"
    kind: free
    label: 짐 찾기
    title: 숙소에서 캐리어 찾기
    place: hotel
    desc: 맡겨 둔 짐을 찾고 12:15쯤 공항으로 출발하세요.
  - time: "12:15"
    kind: meet
    label: 공항 이동
    title: 타오위안 공항 1터미널로
    place: airport
    meta:
      - "{BL10} → {BL12} → {A1} → {A12} 1터미널"
    desc: 룽산쓰역{BL10}에서 메인역{BL12}까지 두 정거장 가서, A1까지 짐을 끌고 10–15분 걸어요. A1에서 보라색 직달차(直達車)를 타면 35분쯤 걸리고 요금은 NT$160이에요. 13:30쯤 공항에 도착해요.
    tips:
      - 일반차는 서는 역이 많아 50분 넘게 걸려요. 열차 색깔과 ‘直達’ 표시를 확인하고 타세요. A1에서 직달차는 매시 00, 15, 30, 45분에 출발해요.
      - 타이거항공은 A1역 **도심 공항 체크인을 이용할 수 없어요.** 공항 1터미널에서 체크인하세요.
      - 비가 오거나 짐이 무거우면 숙소와 바로 이어진 **완화역(萬華車站)**에서 대만철도(台鐵)를 타고 한 정거장 가서 타이베이역에서 내리는 방법도 있어요. 철도 타이베이역은 지하 1층 서쪽 통로로 A1까지 115m라 MRT 메인역에서 걷는 것보다 가까워요. 다만 철도는 MRT보다 자주 다니지 않으니 台鐵 앱으로 출발 시간을 보고, 열차가 금방 없으면 룽산쓰역 MRT로 가세요. 이지카드로 탈 수 있어요.
  - time: "14:10"
    kind: meet
    label: 체크인
    title: 타이거항공 체크인
    local: 台灣虎航 第一航廈
    meta:
      - 카운터 14:10 오픈 · 15:55 마감
    desc: 체크인 카운터는 출발 2시간 30분 전에 열고 45분 전에 닫아요. 연휴라 줄이 길 수 있으니 카운터가 열리면 바로 줄을 서세요.
    tips:
      - 온라인 체크인은 출발 48시간 전(10월 8일 16:40)부터 1시간 전까지 할 수 있어요. 미리 해 두면 카운터에서는 짐만 부치면 돼요.
  - time: "16:40"
    kind: meet
    label: 출국
    title: IT606 부산행 출발
    meta:
      - 부산 김해 19:55 도착 예정
    desc: 탑승구에는 출발 45분 전까지 가는 게 좋고, 탑승구는 출발 10분 전에 닫혀요.
