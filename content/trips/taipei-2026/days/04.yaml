# 하루 일정. 파일 이름 순서가 Day 1, 2, 3 … 이고, 주소는 #/taipei-2026/d4 처럼 돼요.
# stops: kind(meet 집합 · sight 관광 · food 식사 · free 자유) 또는 move(이동 안내 한 줄)
date: "2026-10-10"
short: 귀국
title: 라오산둥 우육면 먹고 공항으로
lead: 비행기가 16:40이라 오전은 여유 있게 보내요. 조식을 먹고 11:20에 체크아웃한 뒤 짐을 맡겨 두고, 시먼의 라오산둥에서 우육면을 먹고 돌아와 공항으로 출발해요. 10월 10일은 국경일(쌍십절)이고 9일부터 11일까지 연휴라 공항이 붐빌 수 있어요. 오전에는 총통부와 타이베이역 남쪽 도로에 차량 통제가 있으니 택시보다 MRT로 다니세요.
chips:
  - tone: ok
    text: 항공편 확정
  - tone: warn
    text: 쌍십절 연휴
facts:
  - label: 출국
    value: 16:40 타이거항공 IT606 · 1터미널
  - label: 공항 도착
    value: 14:00 무렵
  - label: 체크인 카운터
    value: 14:10–15:55
stops:
  - time: "오전"
    kind: food
    label: 조식
    title: 호텔 조식
    place: hotel
    meta:
      - 5층 百宴 Metro Buffet
      - 06:30–10:00
    desc: 3명 모두 조식이 포함돼 있어요. 조식은 10:00에 끝나요.
  - time: "11:20"
    kind: free
    label: 체크아웃
    title: 체크아웃하고 짐 맡기기
    place: hotel
    desc: 체크아웃하고 프런트에 캐리어를 맡겨 두세요. 점심을 먹고 돌아와서 찾으면 돼요.
  - time: "11:30"
    move: 룽산쓰역{BL10}에서 블루라인으로 한 정거장 가서 시먼역{BL11} 6번 출구로 나오면 걸어서 5분이에요. 숙소에서 걸어가도 15분쯤 걸려요.
  - time: "11:40"
    kind: food
    label: 점심
    title: 라오산둥 우육면
    place: laoShandong
    meta:
      - 2026 미쉐린 빕구르망
      - 건물 지하 1층
    desc: 2018년부터 해마다 미쉐린 빕구르망에 오르는 우육면집으로, 손으로 썬 넓적한 면(家常麵)에 한약재를 넣은 홍샤오 국물이 특징이에요.
    tips:
      - 매일 10:30–21:30 열고, 현금만 받으며 예약은 안 돼요. 국경일 점심이라 줄이 있을 수 있어요.
  - time: "12:30"
    kind: free
    label: 짐 찾기
    title: 숙소에서 캐리어 찾기
    place: hotel
    desc: 시먼역에서 한 정거장 돌아와 맡겨 둔 짐을 찾고 12:45쯤 공항으로 출발하세요.
  - time: "12:45"
    kind: meet
    label: 공항 이동
    title: 타오위안 공항 1터미널로
    place: airport
    meta:
      - "{BL10} → {BL12} → {A1} → {A12} 1터미널"
    desc: 룽산쓰역{BL10}에서 메인역{BL12}까지 두 정거장 가서, A1까지 짐을 끌고 10–15분 걸어요. A1에서 보라색 직달차(直達車)를 타면 35분쯤 걸리고 요금은 NT$160이에요. 14:00쯤 공항에 도착해서 바로 체크인 줄을 서면 돼요.
    tips:
      - 일반차는 서는 역이 많아 50분 넘게 걸려요. 열차 색깔과 ‘直達’ 표시를 확인하고 타세요. A1에서 직달차는 매시 00, 15, 30, 45분에 출발해요.
      - 타이거항공은 A1역 **도심 공항 체크인을 이용할 수 없어요.** 공항 1터미널에서 체크인하세요.
      - 비가 오거나 짐이 무거우면 숙소와 바로 이어진 **완화역(萬華車站)**에서 대만철도(台鐵)를 타고 한 정거장 가서 타이베이역에서 내리는 방법도 있어요. 철도 타이베이역은 지하 1층 서쪽 통로로 A1까지 115m라 MRT 메인역에서 걷는 것보다 가까워요. 다만 철도는 MRT보다 자주 다니지 않으니 台鐵 앱으로 출발 시간을 보고, 열차가 금방 없으면 룽산쓰역 MRT로 가세요. 이지카드로 탈 수 있어요.
  - time: "14:10"
    kind: meet
    label: 체크인
    title: 타이거항공 체크인
    local: 台灣虎航 第一航廈
    meta:
      - 카운터 14:10 오픈 · 15:55 마감
    desc: 체크인 카운터는 출발 2시간 30분 전에 열고 45분 전에 닫아요. 연휴라 줄이 길 수 있으니 카운터가 열리면 바로 줄을 서세요.
    tips:
      - 온라인 체크인은 출발 48시간 전(10월 8일 16:40)부터 1시간 전까지 할 수 있어요. 미리 해 두면 카운터에서는 짐만 부치면 돼요.
  - time: "16:40"
    kind: meet
    label: 출국
    title: IT606 부산행 출발
    meta:
      - 부산 김해 19:55 도착 예정
    desc: 탑승구에는 출발 45분 전까지 가는 게 좋고, 탑승구는 출발 10분 전에 닫혀요.
