# 하루 일정. 파일 이름 순서가 Day 1, 2, 3 … 이고, 주소는 #/taipei-2026/d1 처럼 돼요.
# stops: kind(meet 집합 · sight 관광 · food 식사 · free 자유) 또는 move(이동 안내 한 줄)
date: "2026-10-09"
short: 고궁
title: 고궁박물원과 디화제, 저녁은 시먼딩
lead: 아침은 조금 여유 있게 먹고 나가서 고궁박물원을 보고, 오후에는 옛 상점가인 디화제와 다다오청을 걸어요. 카페에서 한숨 돌린 뒤 숙소와 가까운 시먼딩으로 돌아와 저녁을 먹어요. 10월 9일은 국경일(10일 토요일)을 대신한 대체휴일이라 어디든 붐비니, 저녁 훠궈는 꼭 미리 예약하세요.
chips:
  - tone: ok
    text: 고궁 확정
  - tone: warn
    text: 저녁 예약 필요
facts:
  - label: 관람 시간
    value: 09:00–17:00, 월요일 휴관
  - label: 입장권
    value: 예매 완료 (PDF)
  - label: 동선
    value: 스린 → 다다오청 → 시먼딩
weather:
  place: npm
  label: 스린
stops:
  - time: "08:00"
    kind: food
    label: 조식
    title: 호텔 조식
    place: hotel
    meta:
      - 5층 百宴 Metro Buffet
      - 06:30–10:00
    desc: 전날 투어로 늦게 들어왔으니 조금 늦게 일어나도 괜찮아요. 3명 모두 조식이 포함돼 있어요.
  - time: "09:00"
    move: 룽산쓰역{BL10}에서 메인역{BL12}까지 간 뒤 레드라인으로 갈아타 스린역{R15}에서 내리세요. 30분쯤 걸려요. 1번 출구 앞에서 홍30(紅30), 255, 304, 815번 버스를 타면 15분이면 도착하고, 택시로는 NT$150–200 정도 나와요.
  - time: "09:45"
    kind: sight
    title: 국립고궁박물원
    place: npm
    meta:
      - 2시간쯤
      - 12:00 출발
    desc: 국민당 정부가 베이징 자금성의 유물을 옮겨 와 세운 박물관으로, 소장품이 약 70만 점에 달해요. 3층부터 보고 한 층씩 내려오면 동선이 편해요.
    tips:
      - 꼭 보셔야 할 작품은 비취로 만든 배추 **취옥백채(翠玉白菜)**, 동파육처럼 생긴 돌 **육형석(肉形石)**, 청동 솥 **모공정(毛公鼎)**, 상아 한 덩어리를 여러 겹의 공으로 깎은 **상아투화운룡문투구(象牙透雕雲龍紋套球)**예요.
      - 취옥백채와 육형석은 남부 분원에 대여되거나 교체 전시로 빠질 때가 있어요. 당일 전시 여부를 안내 데스크나 공식 사이트에서 확인하세요.
      - 입장권은 예매해 둔 PDF를 입구에서 보여 주세요. **한국어 오디오 가이드**는 1층에서 현장 결제하고 빌려요. 큰 가방은 물품보관소에 맡겨야 입장할 수 있어요.
  - time: "12:00"
    move: 3명이면 박물관 앞에서 택시를 타고 디화제로 바로 가는 게 편해요. 요금은 확인하지 못했어요. 대중교통으로는 버스로 스린역{R15}에 나와 레드라인을 타고 민취안시루역{R13}에서 오렌지라인으로 갈아탄 뒤 다차오터우역{O12}에서 내리면 돼요.
  - time: "12:30"
    kind: food
    label: 점심
    title: 다다오청에서 점심
    local: 大稻埕
    meta:
      - 디화제 근처
    desc: 디화제 근처에서 점심을 먹고 바로 오후 구경을 시작해요. 앉아서 천천히 먹고 싶다면 A, 현지 노포의 맛을 보고 싶다면 B를 고르세요.
    alts:
      - title: 다오서 · 추천
        local: 稻舍食館
        place: riceShine
        desc: 100년 된 쌀가게 건물을 고친 대만 가정식 식당이에요. 고기 반찬 하나에 밥과 국이 나오는 정식(客飯)이 대표 메뉴라 대만 음식이 처음이어도 편하게 드실 수 있어요. 12:00에 문을 열어요.
        tips:
          - 1인 NT$400 정도이고, 최소 주문은 1인 NT$300이며 봉사료 10%가 붙어요.
          - 휴일이라 붐빌 수 있으니 inline이나 전화(02-2550-6607)로 예약하는 게 좋아요. inline은 당일에도 1시간 전까지 예약할 수 있고, 손님이 많으면 식사 시간이 90분으로 제한돼요.
        links:
          - label: inline 예약
            href: https://inline.app/booking/-LMGeAj-quteyNDB4Yxe:inline-live-2a466/-LMGeAk3oEwO59n2RpXq
      - title: 마이몐옌짜이
        local: 賣麵炎仔 金泉小吃店
        place: noodleyeh
        desc: 80년 넘게 3대째 이어 온 국숫집으로, 미쉐린 빕구르망에 올랐어요. 비빔 국수와 완탕국에 진열대에서 고르는 홍사오러우(紅燒肉) 같은 반찬을 곁들여 먹어요. 국수 한 그릇이 아주 저렴해서 여러 가지를 나눠 먹기 좋아요.
        tips:
          - 07:00–14:30에만 열고, 쉬는 날은 페이스북 페이지에 그때그때 올라와요. 줄이 길 수 있으니 너무 늦지 않게 가세요.
          - 현금을 챙겨 가세요.
      - title: 고궁 징화
        local: 故宮晶華
        place: silks
        desc: 배가 많이 고프면 박물관 옆 별관에서 먹고 출발해도 돼요. 딤섬 중심의 레스토랑이고, 취옥백채와 육형석 모양을 본뜬 ‘국보 요리’가 명물이에요. 이 경우 디화제에는 14시쯤 도착해요.
        tips:
          - inline으로 예약할 수 있지만 당일 예약은 온라인으로 안 돼요. 가고 싶다면 전날까지 잡아 두세요.
        links:
          - label: inline 예약
            href: https://inline.app/booking/-LYdzdRWT7Clg_8acfml:inline-live-2a466/-LYdzdUCWblCSv-GYaLn
  - time: "13:30"
    kind: sight
    title: 디화제와 다다오청
    local: 迪化街 · 大稻埕
    place: dihua
    meta:
      - 2시간쯤
    desc: 19세기 무역항으로 번성했던 다다오청의 중심 거리예요. 바로크풍 옛 상가 건물에 건어물과 한약재, 차, 직물 가게가 늘어서 있고, 요즘은 그 사이사이에 소품 가게와 카페가 많이 들어섰어요.
    tips:
      - 거리 중간의 **샤하이 청황묘(霞海城隍廟)**에는 인연을 이어 준다는 월하노인(月下老人)이 있어요. 작은 사당이라 잠깐 들러 보기 좋아요.
      - 말린 망고나 우롱차, 누가 크래커 같은 선물을 사기 좋아요. 가게마다 가격이 조금씩 다르니 비교해 보고 사세요.
      - 시간이 남으면 거리 서쪽 강변의 **다다오청 부두(大稻埕碼頭)**까지 걸어가 보세요.
  - time: "15:30"
    kind: free
    label: 카페 · 휴식
    title: 루궈 카페
    local: 爐鍋咖啡 小藝埕
    place: luguo
    meta:
      - 샤오이청(小藝埕) 2층
    desc: 디화제 옛 건물 2층에 있는 카페예요. 나무 가구와 따뜻한 조명이 있는 차분한 공간이라 걷다가 쉬어 가기 좋아요. 1층 샤오이청에는 대만 디자이너들의 소품 가게가 있어요.
    tips:
      - 영업시간은 11:00–19:00로 나온 곳과 10:30–18:30으로 나온 곳이 있어요. 어느 쪽이든 이 시간에는 열려 있어요.
  - time: "16:30"
    move: 디화제 남쪽 끝에서 베이먼역{G13}까지 걸어서 10분쯤 가요. 그린라인으로 한 정거장만 가면 시먼역{G12}이에요. 숙소에 들러 짐을 두고 나와도 돼요.
  - time: "17:00"
    kind: sight
    title: 시먼딩 구경
    local: 西門町
    place: ximending
    meta:
      - "{BL11} {G12} 시먼역"
    desc: 옷가게와 길거리 음식이 몰려 있는 타이베이의 젊은 번화가예요. 숙소에서 한 정거장이라 저녁까지 편하게 둘러볼 수 있어요.
    tips:
      - 전날 투어의 착한투어 쿠폰북으로 우산 가게 우산왕(雨傘王) 10%, 근무문(筋武門) 마사지 5% 할인을 받을 수 있어요. 투어 버스 번호를 보여 주세요.
      - 저녁을 B 삼미식당으로 정했다면 시먼딩에 도착하자마자 가게 앞 명단에 전화번호와 인원부터 적어 두세요. 17:10에 가게 앞에서 순서대로 부르고, 그때 없으면 다시 줄을 서야 하니 멀리 가지 마세요.
  - time: "18:00"
    kind: food
    label: 저녁
    title: 시먼딩에서 저녁
    local: 西門町
    meta:
      - 휴일 저녁이라 예약이 필요해요
    desc: 마지막 밤이니 1순위는 훠궈예요. 휴일 저녁이라 어디든 붐비니, 예약이 안 되는 곳은 일찍 가서 줄을 서야 해요.
    alts:
      - title: 우라오 시먼딩점 · 1순위
        local: 無老鍋 西門町店
        place: wulao
        desc: 시먼역{BL11} 4번 출구에서 걸어서 2분이고, 숙소까지 한 정거장이라 돌아가기 가장 편해요. 마라탕과 백탕을 반반으로 고를 수 있고, 국물에 끓여 먹는 **아이스크림 두부**가 명물이에요. 마라탕도 매운맛보다 한약재 향이 강한 편이라 매운 걸 잘 못 드셔도 괜찮아요.
        tips:
          - inline으로 예약하세요. 60일 전부터 예약이 열리고, 이 지점은 당일 예약도 돼요. 온라인으로는 4명까지 예약할 수 있고, 10분 넘게 늦으면 예약이 취소될 수 있어요. 한국 번호(+82)로 예약이 되는지는 확인하지 못했어요. 막히면 숙소 프런트에 전화 예약을 부탁하세요.
          - 1인 NT$500–1,500 정도 생각하시면 되고, 테이블당 최소 주문 금액 NT$650과 봉사료 10%가 따로 붙어요.
          - 예약을 못 했다면 17:00에 도착하자마자 2층 카운터에서 대기부터 걸어 두세요. 원격 대기는 안 되고, 자리가 나면 inline이 음성 전화나 문자로 알려 줘요. 휴일 저녁에는 30분에서 몇 시간까지 기다릴 수 있어요.
        links:
          - label: 시먼딩점 inline 예약
            href: https://inline.app/booking/-LDaH7X_NGlrM_Vr0Kj9/-LVCMCC4w-HLsDWli57b
      - title: 삼미식당
        local: 三味食堂
        place: sunway
        desc: 손바닥만 한 연어 초밥으로 유명한 일식집이에요. 양이 많고 값이 저렴해서 한국과 일본 여행자에게 특히 인기가 많아요. 연어 덮밥과 가라아게도 많이 시켜요.
        tips:
          - 저녁은 17:10에 문을 열고 예약도 원격 웨이팅도 안 돼요. 문 열기 1시간쯤 전부터 가게 앞에 놓이는 명단에 전화번호와 인원을 적고, 문 열 때 가게 앞에서 순서대로 부르면 들어가요. 전화로 불러 주지 않아서 부를 때 없으면 다시 줄을 서야 해요.
          - 2시간 넘게 기다렸다는 후기가 많았는데, 2026년 초에 옆 가게까지 넓혀 자리가 두 배가 됐다는 후기도 있어요.
          - 매달 앞쪽 두 번의 월요일과 뒤쪽 두 번의 일요일에 쉬어서 10월 9일 금요일은 여는 날이에요. 특별한 날에는 쉬기도 하니 전화(02-2389-2211)로 확인해 보세요.
      - title: 야러우볜
        local: 鴨肉扁
        place: duckHouse
        desc: 1950년에 문을 연 시먼딩 입구의 노포예요. 이름에는 오리가 들어가지만 실제로는 거위 고기를 팔아요. 삶은 거위 고기에 쌀국수나 국수 한 그릇을 곁들이는 단출한 집이라 금방 먹고 나올 수 있어요.
        tips:
          - 국수가 NT$60, 거위 고기가 NT$100이나 NT$200이에요. 쉬는 날 없이 아침부터 밤 10시쯤까지 열어요.
          - 줄이 길어 보여도 회전이 빨라요. 다른 곳에서 많이 기다려야 할 때 대안으로 좋아요.
  - time: "19:30"
    move: 시먼역{BL11}에서 블루라인을 타고 한 정거장 가면 숙소가 있는 룽산쓰역{BL10}이에요. 배부르면 걸어가도 15분이면 충분해요.
  - time: "19:45"
    kind: free
    label: 숙소
    title: 숙소로 돌아와 쉬기
    place: hotel
    desc: 다음 날은 공항으로 가는 날이라 일찍 들어와서 짐을 미리 싸 두세요. 디화제에서 산 선물은 깨지지 않게 옷 사이에 넣고, 보조배터리는 기내 가방에 따로 챙겨 두면 아침이 편해요. 출출하면 숙소 바로 옆 화시제 야시장에 잠깐 들러도 돼요.
