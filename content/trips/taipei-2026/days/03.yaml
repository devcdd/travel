# 하루 일정. 파일 이름 순서가 Day 1, 2, 3 … 이고, 주소는 #/taipei-2026/d1 처럼 돼요.
# stops: kind(meet 집합 · sight 관광 · food 식사 · free 자유) 또는 move(이동 안내 한 줄)
date: "2026-10-09"
short: 고궁
title: 고궁박물원과 디화제, 저녁은 시먼딩
lead: 아침을 여유 있게 먹고 나가 12시 반부터 15시까지 고궁박물원을 봤어요. 디화제로 넘어가 샤수 티엔핀과 허싱 1947에서 간단히 배를 채우고, 베이먼역까지 걸어가 지하철로 시먼역에 갔어요. 저녁은 시먼딩의 황자디궈 마라훠궈에서 먹고 바로 숙소로 돌아왔어요.
chips:
  - tone: ok
    text: 고궁 확정
facts:
  - label: 관람 시간
    value: 09:00–17:00, 월요일 휴관
  - label: 입장권
    value: 예매 완료 (PDF)
  - label: 동선
    value: 스린 → 다다오청 → 시먼딩
weather:
  place: npm
  label: 스린
stops:
  - time: "09:00"
    kind: food
    label: 조식
    title: 호텔 조식
    place: hotel
    meta:
      - 5층 百宴 Metro Buffet
      - 06:30–10:00
    desc: 오늘은 늦게 출발하니 천천히 드세요. 조식은 10:00에 끝나서 09:30 전에는 내려가는 게 좋아요.
  - time: "11:45"
    move: 룽산쓰역{BL10}에서 메인역{BL12}까지 간 뒤 레드라인으로 갈아타 스린역{R15}에서 내리세요. 30분쯤 걸려요. 1번 출구 앞에서 홍30(紅30), 255, 304, 815번 버스를 타면 15분이면 도착하고, 택시로는 NT$150–200 정도 나와요.
  - time: "12:30"
    kind: sight
    title: 국립고궁박물원
    place: npm
    meta:
      - 2시간 30분쯤
      - 15:00 출발
    desc: 국민당 정부가 베이징 자금성의 유물을 옮겨 와 세운 박물관으로, 소장품이 약 70만 점에 달해요. 3층부터 보고 한 층씩 내려오면 동선이 편해요. 점심은 디화제에 가서 먹으니, 배가 고프면 4층 찻집 산시탕(三希堂, 09:00–17:00)에서 차와 간식으로 잠깐 쉬어 가세요.
    tips:
      - 꼭 보셔야 할 작품은 비취로 만든 배추 **취옥백채(翠玉白菜)**, 동파육처럼 생긴 돌 **육형석(肉形石)**, 청동 솥 **모공정(毛公鼎)**, 상아 한 덩어리를 여러 겹의 공으로 깎은 **상아투화운룡문투구(象牙透雕雲龍紋套球)**예요.
      - 취옥백채와 육형석은 남부 분원에 대여되거나 교체 전시로 빠질 때가 있어요. 당일 전시 여부를 안내 데스크나 공식 사이트에서 확인하세요.
      - 입장권은 예매해 둔 PDF를 입구에서 보여 주세요. **한국어 오디오 가이드**는 1층에서 현장 결제하고 빌려요. 큰 가방은 물품보관소에 맡겨야 입장할 수 있어요.
  - time: "15:00"
    move: 3명이면 박물관 앞에서 택시를 타고 디화제 북쪽(다오서 앞, 迪化街一段329號)으로 가는 게 편해요. 25–30분쯤 걸리고 요금은 확인하지 못했어요. 대중교통으로는 버스로 스린역{R15}에 나와 레드라인을 타고 민취안시루역{R13}에서 오렌지라인으로 갈아탄 뒤 다차오터우역{O12}에서 내리면 돼요.
  - time: "15:30"
    kind: food
    label: 늦은 점심
    title: 샤수 티엔핀 · 아몬드 디저트
    place: xiashu
    desc: 아몬드 빙수를 비롯한 아몬드 디저트 가게예요. 저녁에 훠궈를 먹을 거라 여기와 허싱 1947 두 곳에서 간단히 배를 채웠어요.
    tips:
      - 금요일 10:30–18:30에 열어요. 구글 평점 4.3에 리뷰가 3,000개 넘어요.
  - time: "이어서"
    kind: food
    label: 간식
    title: 허싱 1947 · 전통 떡과 차
    place: hexing
    desc: 대만 전통 찐떡과 과자를 차와 함께 먹을 수 있는 가게예요. 샤수 티엔핀과 몇십 미터 거리예요.
    tips:
      - 금요일 10:00–18:00에 열고, 구글 평점은 4.0이에요.
  - time: "16:15"
    kind: sight
    title: 디화제와 다다오청
    local: 迪化街 · 大稻埕
    place: dihua
    meta:
      - 베이먼역까지 걸으며 구경
    desc: 19세기 무역항으로 번성했던 다다오청의 중심 거리예요. 바로크풍 옛 상가 건물에 건어물과 한약재, 차, 직물 가게가 늘어서 있고, 요즘은 그 사이사이에 소품 가게와 카페가 많이 들어섰어요.
    tips:
      - 거리 중간의 **샤하이 청황묘(霞海城隍廟)**에는 인연을 이어 준다는 월하노인(月下老人)이 있어요. 작은 사당이라 잠깐 들러 보기 좋아요.
      - 말린 망고나 우롱차, 누가 크래커 같은 선물을 사기 좋아요. 가게마다 가격이 조금씩 다르니 비교해 보고 사세요.
      - 시간이 남으면 거리 서쪽 강변의 **다다오청 부두(大稻埕碼頭)**까지 걸어가 보세요.
  - time: "18:00"
    move: 디화제 남쪽 끝에서 베이먼역{G13}까지 걸어서 10분쯤 가요. 그린라인으로 한 정거장만 가면 시먼역{G12}이에요.
  - time: "18:30"
    kind: food
    label: 저녁
    title: 황자디궈 마라훠궈
    place: kingFood
    meta:
      - 구글 평점 4.9
      - "{BL11} 시먼역 근처"
    desc: 영어 이름이 King Food Spicy Mala인 마라훠궈집이에요. 시먼딩 중화로 1단에 있어요.
    tips:
      - 구글 지도 기준으로 11:30–23:00(토·일 11:00부터)에 열고 목요일에 쉬어요.
  - time: "21:00"
    move: 시먼역{BL11}에서 블루라인을 타고 한 정거장 가면 숙소가 있는 룽산쓰역{BL10}이에요. 걸어가도 15분이면 충분해요.
  - time: "21:15"
    kind: free
    label: 숙소
    title: 숙소로 돌아와 쉬기
    place: hotel
    desc: 훠궈를 먹고 바로 숙소로 돌아왔어요. 다음 날은 공항으로 가는 날이라 짐을 미리 싸 두세요. 디화제에서 산 선물은 깨지지 않게 옷 사이에 넣고, 보조배터리는 기내 가방에 따로 챙겨 두면 아침이 편해요.
