# 하루 일정. 파일 이름 순서가 Day 1, 2, 3 … 이고, 주소는 #/taipei-2026/d1 처럼 돼요.
# stops: kind(meet 집합 · sight 관광 · food 식사 · free 자유) 또는 move(이동 안내 한 줄)
date: "2026-10-09"
short: 고궁
title: 국립고궁박물원, 오후는 북쪽으로
lead: 단체 관광객이 몰리기 전, 문을 열자마자 들어가는 게 가장 여유로워요. 고궁박물원이 스린에 있어서 오후에는 같은 레드라인을 타고 북쪽의 베이터우나 단수이로 이어 가기 좋아요. 10월 9일은 국경일(10일 토요일)을 대신한 대체휴일이라 현지인 나들이객이 많아요. 고궁박물원은 문 여는 시간에 맞춰 가시고, 마지막 밤 저녁인 훠궈도 꼭 미리 예약하세요.
chips:
  - tone: ok
    text: 고궁 확정
  - tone: idea
    text: 오후 · 저녁 제안
facts:
  - label: 관람 시간
    value: 09:00–17:00, 월요일 휴관
  - label: 입장료
    value: 약 NT$350
  - label: 가는 길
    value: "{R15} 스린역에서 버스"
weather:
  place: npm
  label: 스린
stops:
  - time: "07:30"
    kind: food
    label: 조식
    title: 호텔 조식
    place: hotel
    meta:
      - 5층 百宴 Metro Buffet
      - 06:30–10:00
    desc: 고궁박물원 개관 시간에 맞춰 나가야 하니 일찍 드세요. 3명 모두 조식이 포함돼 있어요.
  - time: "08:20"
    move: 룽산쓰역{BL10}에서 메인역{BL12}까지 간 뒤 레드라인으로 갈아타 스린역{R15}에서 내리세요. 30분쯤 걸려요. 1번 출구 앞에서 홍30(紅30), 255, 304, 815번 버스를 타면 15분이면 도착하고, 택시로는 NT$150–200 정도 나와요.
  - time: "09:15"
    kind: sight
    title: 국립고궁박물원
    place: npm
    meta:
      - 2시간 30분–3시간
    desc: 국민당 정부가 베이징 자금성의 유물을 옮겨 와 세운 박물관으로, 소장품이 약 70만 점에 달해요. 3층부터 보고 한 층씩 내려오면 동선이 편해요.
    tips:
      - 꼭 보셔야 할 작품은 비취로 만든 배추 **취옥백채(翠玉白菜)**, 동파육처럼 생긴 돌 **육형석(肉形石)**, 청동 솥 **모공정(毛公鼎)**, 상아 한 덩어리를 여러 겹의 공으로 깎은 **상아투화운룡문투구(象牙透雕雲龍紋套球)**예요.
      - 취옥백채와 육형석은 남부 분원에 대여되거나 교체 전시로 빠질 때가 있어요. 당일 전시 여부를 안내 데스크나 공식 사이트에서 확인하세요.
      - 1층에서 **한국어 오디오 가이드**를 빌릴 수 있어요. 큰 가방은 물품보관소에 맡겨야 입장할 수 있어요.
  - time: "12:00"
    kind: food
    label: 점심
    title: 고궁 징화
    place: silks
    meta:
      - 박물관 옆 별관
    desc: 딤섬을 중심으로 하는 레스토랑이에요. 취옥백채와 육형석 모양을 본뜬 ‘국보 요리’가 이곳의 명물이에요. 가볍게 드시고 싶다면 본관 4층 찻집 산시탕(三希堂)에서 차와 다과를 즐겨 보세요.
  - time: "13:30"
    kind: free
    title: 오후 일정 고르기
    meta:
      - 스린역에서 레드라인을 타고 북쪽으로
    alts:
      - title: 베이터우 온천
        local: 北投
        place: beitou
        desc: 신베이터우역{R22A}에서 내리면 돼요. 유황 연기가 피어오르는 지열곡(地熱谷)과 온천박물관을 둘러보고, 대중탕이나 호텔 개인탕에서 쉬어 가세요. 두 곳 모두 월요일에만 쉬어서 이날은 문제없어요.
      - title: 단수이 노을
        local: 淡水
        place: tamsui
        desc: 스린에서 단수이역{R28}까지 25분쯤 걸려요. 강변 옛 거리를 걷다가 17:40 무렵 강 하구로 지는 해를 보세요. 대왕 오징어튀김과 유부 속에 당면을 채운 아게이(阿給)가 명물이에요.
      - title: 숙소에서 쉬기
        place: hotel
        desc: 전날 투어로 피곤하다면 낮에는 숙소에서 쉬고 저녁만 나가셔도 충분해요.
  - time: "18:30"
    kind: food
    label: 저녁
    title: 훠궈 또는 만두
    local: 火鍋 · 餃子
    meta:
      - 휴일 저녁이라 예약이 필요해요
    desc: 아래 세 훠궈집은 모두 대만 예약 서비스 **inline**으로 온라인 예약을 받아요. 대체휴일 금요일 18:30은 가장 붐비는 시간대라 지금 바로 자리를 확인해 보세요. 한국 번호(+82)로 예약이 되는지는 확인하지 못했어요. 예약이 막히면 숙소 프런트에 전화 예약을 부탁하세요.
    alts:
      - title: 우라오 시먼딩점 · 1순위
        local: 無老鍋 西門町店
        place: wulao
        desc: 시먼역{BL11} 4번 출구에서 걸어서 2분이고, 숙소까지 한 정거장이라 돌아가기 가장 편해요. 마라탕과 백탕을 반반으로 고를 수 있고, 국물에 끓여 먹는 **아이스크림 두부**가 명물이에요. 마라탕도 매운맛보다 한약재 향이 강한 편이라 매운 걸 잘 못 드셔도 괜찮아요.
        tips:
          - inline으로 예약하세요. 60일 전부터 예약이 열리고, 이 지점은 당일 예약도 돼요. 온라인으로는 4명까지 예약할 수 있고, 10분 넘게 늦으면 예약이 취소될 수 있어요.
          - 1인 NT$500–1,500 정도 생각하시면 되고, 테이블당 최소 주문 금액 NT$650과 봉사료 10%가 따로 붙어요.
          - 현장 대기는 직접 가서 이름을 올려야 해요. 휴일 저녁에는 30분에서 몇 시간까지 기다릴 수 있으니, 예약을 못 했다면 17:30쯤 먼저 가서 대기를 걸어 두세요.
          - 단수이나 베이터우에서 내려오는 길이라면 중산역{R11} 근처 **중산점**도 좋아요. 중산점은 하루 전까지 예약해야 해요.
        links:
          - label: 시먼딩점 inline 예약
            href: https://inline.app/booking/-LDaH7X_NGlrM_Vr0Kj9/-LVCMCC4w-HLsDWli57b
          - label: 중산점 inline 예약
            href: https://inline.app/booking/-LDaH7X_NGlrM_Vr0Kj9/-LDaIMfFMryvW2keZdSe
      - title: 칭화자오 중산북점 · 2순위
        local: 青花驕 中山北店
        place: chinHuajiao
        desc: 중산역{R11}에서 걸어서 3분이라 오후에 북쪽에 다녀오는 동선과 잘 맞아요. 산초가 얼얼한 마라탕 전문점이고, 맵기는 소·중·대 중에서 고를 수 있어요.
        tips:
          - inline으로 예약하세요. 한 달 전쯤부터 예약이 열리고, 당일에도 30분 전까지는 예약할 수 있어요. 8명까지 가능하고 보증금은 따로 없는 것으로 보여요.
          - 예약이 꽉 찼다면 당일 17:00–22:00 사이에 inline에서 **원격 대기**를 걸어 보세요. 이동하면서 순서를 기다릴 수 있어요.
          - 1인 NT$700–800 정도이고 봉사료 10%가 붙어요. 오리 선지와 언 두부는 무한으로 리필해 줘요.
        links:
          - label: 중산북점 inline 예약
            href: https://inline.app/booking/-MaXEQcbiWaRjXyLytUu:inline-live-2/-MaXER3I3tbJ6YWZIFGu
      - title: 오렌지 샤부샤부
        local: 橘色涮涮屋
        place: orange
        desc: 1인 냄비에 와규와 활해산물을 내는 고급 샤부샤부집이에요. 국물이 다시마·가쓰오 육수와 스키야키라 맵지 않아요. 다만 중샤오푸싱역{BL15}에서 걸어서 10분이라 이번 동선에서는 가장 멀어요.
        tips:
          - inline으로 30일 전쯤부터 예약할 수 있고, **하루 전까지만** 받아서 당일 예약은 안 돼요. 금요일 저녁에 가려면 10월 8일까지 예약하세요.
          - 세트 기준 1인 NT$1,380(오골계)부터 와규 NT$5,000 안팎까지이고, 봉사료 10%가 붙어요.
        links:
          - label: 大安 inline 예약
            href: https://inline.app/booking/-LL7w1Y0HNb5dvdA1v7N:inline-live-2a466/-L_j6l1gF4kY3lEjygtx
      - title: 용문객잔교자관
        place: longmen
        desc: 산다오쓰역{BL13} 근처로, 숙소에서 블루라인으로 세 정거장이에요. 3번 출구에서 걸어서 9분이에요. 1969년에 문을 연 오래된 만두집으로, 진열대에서 냉채 반찬을 직접 골라 담고 물만두를 곁들여 먹어요. 저녁 17:00–23:00에만 열고 월요일은 쉬어요. 저녁 시간에는 줄이 길 수 있으니 현금을 챙겨 일찍 가세요.
  - time: "20:30"
    kind: food
    label: 야식
    title: 마지막 밤 야시장
    alts:
      - title: 화시제 야시장
        local: 華西街夜市
        place: huaxi
        desc: 숙소 바로 옆이라 늦게까지 놀다가 바로 들어가기 좋아요.
      - title: 닝샤 야시장
        local: 寧夏夜市
        place: ningxia
        desc: 솽롄역{R12}에서 걸어서 7분이에요. 규모가 작고 현지인이 많이 찾는 야시장이에요. 굴전(蚵仔煎)과 타로볼 튀김(芋餅)을 꼭 드셔 보세요.
      - title: 스린 야시장
        local: 士林夜市
        place: shilinNM
        desc: 젠탄역{R16}에서 가까워요. 타이베이에서 가장 크고 관광객도 많은 야시장이라, 단수이에서 돌아오는 길에 들르기 좋아요.
