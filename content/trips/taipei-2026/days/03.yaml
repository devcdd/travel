# 하루 일정. 파일 이름 순서가 Day 1, 2, 3 … 이고, 주소는 #/taipei-2026/d1 처럼 돼요.
# stops: kind(meet 집합 · sight 관광 · food 식사 · free 자유) 또는 move(이동 안내 한 줄)
date: "2026-10-09"
short: 고궁
title: 고궁박물원과 디화제, 저녁은 시먼딩
lead: 아침을 여유 있게 먹고 나가 12시 반쯤 고궁박물원에 도착해요. 점심은 박물관 안에서 간단히 먹고 15시까지 둘러본 뒤, 디화제와 다다오청을 걸으며 간식과 카페를 즐겨요. 저녁은 시먼딩에서 훠궈를 먹어요. 10월 9일은 국경일(10일 토요일)을 대신한 대체휴일이라 어디든 붐비니, 훠궈는 꼭 미리 예약하세요.
chips:
  - tone: ok
    text: 고궁 확정
  - tone: warn
    text: 훠궈 예약 필요
facts:
  - label: 관람 시간
    value: 09:00–17:00, 월요일 휴관
  - label: 입장권
    value: 예매 완료 (PDF)
  - label: 동선
    value: 스린 → 다다오청 → 시먼딩
weather:
  place: npm
  label: 스린
stops:
  - time: "09:00"
    kind: food
    label: 조식
    title: 호텔 조식
    place: hotel
    meta:
      - 5층 百宴 Metro Buffet
      - 06:30–10:00
    desc: 오늘은 늦게 출발하니 천천히 드세요. 조식은 10:00에 끝나서 09:30 전에는 내려가는 게 좋아요.
  - time: "11:45"
    move: 룽산쓰역{BL10}에서 메인역{BL12}까지 간 뒤 레드라인으로 갈아타 스린역{R15}에서 내리세요. 30분쯤 걸려요. 1번 출구 앞에서 홍30(紅30), 255, 304, 815번 버스를 타면 15분이면 도착하고, 택시로는 NT$150–200 정도 나와요.
  - time: "12:30"
    kind: food
    label: 점심
    title: 고궁에서 간단한 점심
    local: 故宮博物院
    meta:
      - 박물관 안
    desc: 도착하면 박물관 안에서 가볍게 먹고 관람을 시작해요. 저녁에 훠궈를 먹으니 점심은 간단하게 드세요.
    alts:
      - title: 산시탕 · 4층 찻집
        local: 三希堂
        place: npm
        desc: 본관 4층의 찻집으로 차와 함께 딤섬이나 간단한 식사를 먹을 수 있어요. 오늘(금) 09:00–17:00에 열고 구글 평점은 4.2예요.
      - title: 고궁 징화 · 별관 딤섬
        place: silks
        desc: 박물관 옆 별관의 딤섬 레스토랑이에요. 점심은 11:30–14:30이고, 당일 온라인 예약은 안 돼서 가서 자리를 물어봐야 해요. 휴일이라 기다릴 수 있으니 오래 걸리면 A로 가세요.
  - time: "13:15"
    kind: sight
    title: 국립고궁박물원
    place: npm
    meta:
      - 1시간 45분쯤
      - 15:00 출발
    desc: 국민당 정부가 베이징 자금성의 유물을 옮겨 와 세운 박물관으로, 소장품이 약 70만 점에 달해요. 시간이 넉넉하지 않으니 3층의 대표 작품부터 보고 한 층씩 내려오세요.
    tips:
      - 꼭 보셔야 할 작품은 비취로 만든 배추 **취옥백채(翠玉白菜)**, 동파육처럼 생긴 돌 **육형석(肉形石)**, 청동 솥 **모공정(毛公鼎)**, 상아 한 덩어리를 여러 겹의 공으로 깎은 **상아투화운룡문투구(象牙透雕雲龍紋套球)**예요.
      - 취옥백채와 육형석은 남부 분원에 대여되거나 교체 전시로 빠질 때가 있어요. 당일 전시 여부를 안내 데스크나 공식 사이트에서 확인하세요.
      - 입장권은 예매해 둔 PDF를 입구에서 보여 주세요. **한국어 오디오 가이드**는 1층에서 현장 결제하고 빌려요. 큰 가방은 물품보관소에 맡겨야 입장할 수 있어요.
  - time: "15:00"
    move: 3명이면 박물관 앞에서 택시를 타고 디화제 북쪽(다오서 앞, 迪化街一段329號)으로 가는 게 편해요. 25–30분쯤 걸리고 요금은 확인하지 못했어요. 대중교통으로는 버스로 스린역{R15}에 나와 레드라인을 타고 민취안시루역{R13}에서 오렌지라인으로 갈아탄 뒤 다차오터우역{O12}에서 내리면 돼요.
  - time: "15:30"
    kind: sight
    title: 디화제와 다다오청
    local: 迪化街 · 大稻埕
    place: dihua
    meta:
      - 북쪽에서 남쪽으로 2시간쯤
    desc: 19세기 무역항으로 번성했던 다다오청의 중심 거리예요. 바로크풍 옛 상가 건물에 건어물과 한약재, 차, 직물 가게가 늘어서 있고, 요즘은 그 사이사이에 소품 가게와 카페가 많이 들어섰어요.
    tips:
      - 거리 중간의 **샤하이 청황묘(霞海城隍廟)**에는 인연을 이어 준다는 월하노인(月下老人)이 있어요. 작은 사당이라 잠깐 들러 보기 좋아요.
      - 말린 망고나 우롱차, 누가 크래커 같은 선물을 사기 좋아요. 가게마다 가격이 조금씩 다르니 비교해 보고 사세요.
      - 시간이 남으면 거리 서쪽 강변의 **다다오청 부두(大稻埕碼頭)**까지 걸어가 보세요.
  - time: "15:40"
    kind: food
    label: 간식
    title: 디화제 북쪽 간식
    meta:
      - 걷기 시작하는 북쪽 끝
    alts:
      - title: 샤수 티엔핀 · 아몬드 디저트
        place: xiashu
        desc: 아몬드 빙수를 비롯한 아몬드 디저트 가게예요. 구글 평점 4.3에 리뷰가 3,000개 넘어요.
        tips:
          - 오늘(금) 10:30–18:30에 열어요.
      - title: 허싱 1947 · 전통 떡과 차
        place: hexing
        desc: 대만 전통 찐떡과 과자를 차와 함께 먹을 수 있는 가게예요. 샤수 티엔핀과 몇십 미터 거리라 둘 다 들르기 쉬워요.
        tips:
          - 오늘(금) 10:00–18:00에 열고, 구글 평점은 4.0이에요.
  - time: "17:00"
    kind: free
    label: 카페 · 휴식
    title: 디화제 남쪽 카페
    meta:
      - 남쪽 끝은 베이먼역 가는 길이에요
    alts:
      - title: 루궈 카페
        place: luguo
        desc: 디화제 옛 건물 2층에 있는 카페예요. 나무 가구와 따뜻한 조명이 있는 차분한 공간이라 걷다가 쉬어 가기 좋아요. 1층 샤오이청에는 대만 디자이너들의 소품 가게가 있어요.
        tips:
          - 영업시간은 11:00–19:00로 나온 곳과 10:30–18:30으로 나온 곳이 있어요. 어느 쪽이든 이 시간에는 열려 있어요.
      - title: 팔라스 카페 · 커피와 케이크
        place: pallas
        desc: 직접 원두를 볶는 카페로 커피와 케이크가 좋아요. 구글 평점 4.5에 리뷰가 1,600개 넘고, 오늘(금) 11:00–19:00에 열어요.
      - title: 보포무 · 샌드위치와 음료
        place: bopomoo
        desc: 샌드위치와 디저트, 음료를 파는 카페로 구글 평점 4.9예요. 출출하면 샌드위치로 가볍게 배를 채우기 좋고, 오늘(금) 11:30–20:00에 열어요.
      - title: 푸다오 과실 · 케이크와 구움과자
        place: fudao
        desc: 케이크와 구움과자를 파는 디저트 가게예요. 구글 평점 4.2이고, 오늘(금) 10:00–18:00에 열어요. 선물용 과자를 사 가기에도 좋아요.
  - time: "18:00"
    move: 디화제 남쪽 끝에서 베이먼역{G13}까지 걸어서 10분쯤 가요. 그린라인으로 한 정거장만 가면 시먼역{G12}이에요.
  - time: "18:30"
    kind: food
    label: 저녁
    title: 시먼딩에서 훠궈
    local: 火鍋
    meta:
      - 휴일 저녁이라 예약이 필요해요
    desc: 마지막 밤은 시먼딩 훠궈예요. 구글 평점이 높은 순서로 정리했고 모두 시먼역에서 걸어서 5분 안쪽이에요. 휴일 저녁이라 어디든 붐비니 예약해 두거나, 원격 대기가 되는 잔지를 먼저 걸어 두세요.
    alts:
      - title: 솬러 와규 훠궈 · 평점 4.9
        place: shuanle
        desc: 와규를 1인 냄비로 즐기는 곳으로 구글 리뷰가 2만 개 넘어요. 시먼역 바로 앞이고 오늘 11:30부터 자정까지 열어요.
        tips:
          - 예약 방법은 확인하지 못했어요. 지도에서 가게 정보를 열어 예약 링크가 있는지 보세요.
      - title: 원딩 마라훠궈 · 평점 4.8
        place: wending
        desc: 한약재를 넣은 마라 국물로 유명한 체인으로 구글 리뷰가 1만 개 넘어요. 오늘 11:30부터 자정까지 열어요.
      - title: 촨뉴 소고기 훠궈 · 평점 4.8
        place: cuanniu
        desc: 신선한 소고기를 맑은 국물에 데쳐 먹는 타이난식 훠궈예요. 마라가 부담스러우면 좋은 선택이고, 17:00–23:30에 열어요.
      - title: 러우즈젠 훠궈 · 평점 4.8
        place: rouzhijian
        desc: 큰 접시에 고기를 푸짐하게 내는 곳이에요. 오늘 11:30부터 새벽 2시까지 열어요.
      - title: 잔지 마라훠궈 · 평점 4.6
        place: zhanji
        desc: 옛 대세계 극장 건물 지하의 인기 마라훠궈집이에요. 젤리처럼 부드러운 오리 선지와 앵거스 소갈비가 유명하고, 12:00부터 새벽 1시까지 열어요.
        tips:
          - 가게에 가지 않고 inline에서 원격 대기를 걸 수 있어요. 디화제에 있을 때 미리 걸어 두세요.
        links:
          - label: inline 예약·대기
            href: https://inline.app/booking/-KO9-zyZTRpTH7LNAe99/-NvFDHdbyHM7P2vbgoDP
      - title: 우라오 시먼딩점 · 평점 4.4
        local: 無老鍋 西門町店
        place: wulao
        desc: 시먼역{BL11} 4번 출구에서 걸어서 2분이고, 숙소까지 한 정거장이라 돌아가기 가장 편해요. 마라탕과 백탕을 반반으로 고를 수 있고, 국물에 끓여 먹는 **아이스크림 두부**가 명물이에요. 마라탕도 매운맛보다 한약재 향이 강한 편이라 매운 걸 잘 못 드셔도 괜찮아요.
        tips:
          - inline으로 예약하세요. 60일 전부터 예약이 열리고, 이 지점은 당일 예약도 돼요. 온라인으로는 4명까지 예약할 수 있고, 10분 넘게 늦으면 예약이 취소될 수 있어요. 한국 번호(+82)로 예약이 되는지는 확인하지 못했어요. 막히면 숙소 프런트에 전화 예약을 부탁하세요.
          - 1인 NT$500–1,500 정도 생각하시면 되고, 테이블당 최소 주문 금액 NT$650과 봉사료 10%가 따로 붙어요.
          - 예약을 못 했다면 17:00에 도착하자마자 2층 카운터에서 대기부터 걸어 두세요. 원격 대기는 안 되고, 자리가 나면 inline이 음성 전화나 문자로 알려 줘요. 휴일 저녁에는 30분에서 몇 시간까지 기다릴 수 있어요.
        links:
          - label: 시먼딩점 inline 예약
            href: https://inline.app/booking/-LDaH7X_NGlrM_Vr0Kj9/-LVCMCC4w-HLsDWli57b
      - title: 딩왕 마라훠궈 · 평점 4.1
        place: dingWang
        desc: 한국 연예인들도 즐겨 찾는다고 알려진 마라훠궈 체인이에요. 1인 국물값 NT$160에 재료를 따로 시키고, 오리 선지와 두부, 밥을 계속 채워 줘요. 매일 11:00부터 새벽 2시까지 열어요.
        tips:
          - inline으로 예약하세요. 당일 온라인 예약은 2시간 전까지 되고, 원격 대기는 안 돼요.
        links:
          - label: inline 예약
            href: https://inline.app/booking/-LDaBuB5UvBj5xtnOUlH/-LrRtlMWRLdTGwI6CQ-w
  - time: "20:00"
    kind: sight
    title: 시먼딩 구경
    local: 西門町
    place: ximending
    meta:
      - "{BL11} {G12} 시먼역"
    desc: 옷가게와 길거리 음식이 몰려 있는 타이베이의 젊은 번화가예요. 저녁을 먹고 소화시킬 겸 천천히 둘러보세요.
    tips:
      - 전날 투어의 착한투어 쿠폰북으로 우산 가게 우산왕(雨傘王) 10%, 근무문(筋武門) 마사지 5% 할인을 받을 수 있어요. 투어 버스 번호를 보여 주세요.
  - time: "21:00"
    move: 시먼역{BL11}에서 블루라인을 타고 한 정거장 가면 숙소가 있는 룽산쓰역{BL10}이에요. 걸어가도 15분이면 충분해요.
  - time: "21:15"
    kind: free
    label: 숙소
    title: 숙소로 돌아와 쉬기
    place: hotel
    desc: 다음 날은 공항으로 가는 날이라 짐을 미리 싸 두세요. 디화제에서 산 선물은 깨지지 않게 옷 사이에 넣고, 보조배터리는 기내 가방에 따로 챙겨 두면 아침이 편해요.
