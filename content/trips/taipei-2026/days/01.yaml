# 하루 일정. 파일 이름 순서가 Day 1, 2, 3 … 이고, 주소는 #/taipei-2026/d1 처럼 돼요.
# stops: kind(meet 집합 · sight 관광 · food 식사 · free 자유) 또는 move(이동 안내 한 줄)
date: "2026-10-07"
short: 도착 · 101
title: 딤섬 점심, 룽산쓰, 101 노을과 야시장
lead: 오전에 도착해서 숙소에 짐부터 맡기고, 숙소 근처에서 딤섬으로 점심을 먹은 뒤 룽산쓰(용산사)를 둘러봐요. 15시에 체크인하고 101로 넘어가서 딘타이펑 번호표를 받아 둔 다음, 전망대에서 노을을 보고 저녁을 먹어요. 하루의 마지막은 101 근처 야시장이에요.
chips:
  - tone: ok
    text: 확정
facts:
  - label: 도착
    value: 10:30 타오위안 공항 1터미널
  - label: 체크인
    value: 15:00부터
  - label: 일몰
    value: 17:35 무렵
weather:
  place: tp101
  label: 타이베이
stops:
  - time: "10:30"
    kind: free
    label: 도착
    title: 타오위안 공항 1터미널 도착
    local: 桃園國際機場 第一航廈
    meta:
      - 대한항공 KE2085
      - 부산 김해 09:00 출발
    desc: 입국 심사를 마치고 짐을 찾은 뒤, 공항철도 표지판을 따라 A12 공항 1터미널역으로 가세요.
    tips:
      - 공항 MRT역이나 편의점에서 **이지카드(悠遊卡)**를 사서 충전해 두세요. 지하철, 버스, 편의점 결제까지 여행 내내 이 카드 하나로 해결돼요.
      - 데이터 유심이나 eSIM을 아직 준비하지 못했다면 입국장의 통신사 카운터에서 살 수 있어요.
  - time: "11:00"
    move: A12역에서 보라색 직달차(直達車)를 타면 타이베이 메인역{A1}까지 35분쯤 걸리고 요금은 NT$160이에요. A1에서 블루라인 메인역{BL12}까지는 짐을 끌고 10–15분 걸으니 지하 1층의 파란색 표지판을 따라가세요. 두 정거장 가면 룽산쓰역{BL10}이에요.
  - time: "12:00"
    kind: free
    label: 짐 맡기기
    title: 숙소에 캐리어 맡기기
    place: hotel
    meta:
      - "{BL10} 룽산쓰역에서 걸어서 3분"
    desc: 체크인은 15:00부터라 프런트에 짐만 맡겨 두고 가볍게 나가세요. 체크인 전에도 짐을 맡아 줘요.
  - time: "12:15"
    kind: food
    label: 점심
    title: 딤섬이나 루러우판 점심
    meta:
      - 숙소 안이나 걸어서 5분, 한두 정거장 거리
    alts:
      - title: 자옌 · 숙소 3층 · 추천
        place: jiayan
        desc: 숙소 3층에 있는 광둥·상하이 요리 식당으로, 홍콩식 딤섬으로 이름난 곳이에요. 짐을 맡기고 바로 올라가면 돼서 도착한 날 가장 편해요. 캐비아 사오마이(魚子燒賣)와 새우 두부피말이(鮮蝦腐皮捲)가 인기예요.
        tips:
          - 점심은 11:30–14:30이고 주문은 14:00까지 받아요. TableCheck 온라인 예약이나 전화(02-2383-6798)로 3명 자리를 미리 잡아 두세요.
          - 1인 평균 NT$1,000 안팎이라는 후기가 있지만, 딤섬만 먹을 때 가격은 확인하지 못했어요.
        links:
          - label: TableCheck 예약
            href: https://www.tablecheck.com/ko/caesar-metro-jiayan/reserve/landing
      - title: 진스러우 · 카트 딤섬
        place: goldenLion
        desc: 직원이 수레를 밀고 다니며 딤섬을 골라 담게 해 주는 옛날식 홍콩 찻집이에요. 시먼역{BL11} 6번 출구에서 걸어서 5–8분, 건물 10층에 있어요. 차슈바오(叉燒包), 게알 사오마이(蟹黃燒賣), 새우 창펀(鮮蝦腸粉)이 대표 메뉴예요.
        tips:
          - 매일 10:00–21:30 열고 평일에는 예약 없이 가도 돼요. 딤섬은 크기에 따라 NT$110–160이고 찻값과 봉사료 10%가 따로 붙어요.
          - 시설이 오래된 편이라는 후기가 있어요. 분위기보다 수레 딤섬 경험을 원할 때 가 보세요.
      - title: 팀호완 타이베이역점
        place: timHoWan
        desc: 홍콩에서 온 딤섬 체인으로, 메인역{BL12} 근처에 있어요. 바삭한 차슈바오(酥皮焗叉燒包)가 가장 유명하고, 1인 NT$700–1,000에 봉사료 10%가 붙어요.
        tips:
          - inline으로 예약할 수 있어요. 10월 6일에 봤을 때는 신광미츠코시 예약 페이지에 무료 예약으로 나와 있었고, 7일 12:30 이후 자리도 남아 있었어요.
          - 원격 대기도 있지만 대만 휴대폰 번호로만 걸 수 있어서 한국 번호로는 쓸 수 없어요.
      - title: 샤오왕주과 · 화시제 루러우판
        place: xiaoWang
        desc: 숙소에서 걸어서 갈 수 있는 화시제 야시장 안의 미쉐린 빕구르망 루러우판 집이에요. 작은 그릇이 NT$35이고, 배추 조림(白菜滷)과 맑은 국(清湯瓜仔肉)을 곁들여 먹어요.
        tips:
          - 09:30–20:00에 열고 화요일에 쉬어서 수요일인 오늘은 문을 열어요. 현금만 받아요.
          - 줄이 길면 바로 옆 아이 루러우판으로 가세요. 룽산쓰도 바로 근처라 먹고 나서 걸어가면 돼요.
      - title: 아이 루러우판 · 샤오왕주과 대안
        place: aYi
        desc: 샤오왕주과와 거의 붙어 있는 60년 가까이 된 루러우판 집이에요. 굴을 올린 굴 루러우판(蚵仔滷肉飯)이 가장 유명해요.
        tips:
          - 매일 11:00–20:00에 열어요. 가격과 카드 결제 여부는 확인하지 못했으니 현금을 챙기세요.
  - time: "13:30"
    kind: sight
    title: 룽산쓰(용산사)
    place: longshan
    meta:
      - 숙소에서 걸어서 5분
      - 06:00–22:00 · 무료
      - 30분–1시간
    desc: 1738년에 세워진, 타이베이에서 가장 오래된 사원이에요. 본전에는 관세음보살을, 뒤쪽 후전에는 바다의 여신 마조와 학문의 신 문창제군, 관우, 인연을 맺어 주는 월하노인을 모셔요. 앞쪽 전각의 구리 용 기둥과 지붕의 화려한 용 장식도 눈여겨보세요.
    tips:
      - 참배는 오른쪽 용문(龍門)으로 들어가서 본전에 인사하고, 뒤돌아 하늘의 신(天公)께 인사한 다음 후전을 차례로 돌고 왼쪽 호문(虎門)으로 나오는 순서예요.
      - 반달 모양 나무 조각 두 개(筊杯)를 던져 신에게 답을 묻는 점괘도 해 볼 수 있어요. 한쪽은 평평한 면, 한쪽은 둥근 면이 나오면 ‘허락’이라는 뜻이에요.
      - 기도하는 사람을 가까이에서 찍거나 플래시를 쓰는 건 피해 주세요.
  - time: "14:20"
    kind: sight
    label: 선택
    title: 보피랴오 역사거리
    place: bopiliao
    meta:
      - 룽산쓰 바로 옆
      - 거리 09:00–21:00 · 무료
    desc: 청나라부터 일제강점기까지의 붉은 벽돌 건물이 그대로 남아 있는 골목이에요. 영화 ‘艋舺(Monga)’의 촬영지로도 유명해요. 체크인까지 시간이 남으면 천천히 걸어 보세요. 실내 전시는 18:00에 닫고 월요일은 쉬어요.
  - time: "15:00"
    kind: free
    label: 체크인
    title: 숙소 체크인
    place: hotel
    desc: 방에 짐을 풀고 잠깐 쉬었다가 15:45쯤 101로 출발하세요.
  - time: "15:45"
    move: 룽산쓰역{BL10}에서 블루라인을 타고 메인역{BL12}에서 레드라인으로 갈아탄 뒤 타이베이101역{R03}에서 내리세요. 30분쯤 걸려요.
  - time: "16:20"
    kind: food
    label: 번호표 먼저
    title: 딘타이펑 101점 번호표 받기
    place: dtf101
    meta:
      - 101 쇼핑몰 지하 1층
      - 10:45–20:30
    desc: 대만 딘타이펑은 예약도 원격 웨이팅도 안 돼서, 매장에서 받은 번호표 순서대로 들어가요. 101에 도착하면 지하 1층 딘타이펑에서 3명 번호표부터 받아 두세요. 대기 조회 페이지(한국어 지원)에서 3–4인 칸의 호출 번호를 내 번호표와 비교하면 순서가 어디까지 왔는지 알 수 있어서, 전망대를 구경하면서 기다리면 돼요.
    tips:
      - 일행이 모두 와야 자리를 안내해 줘요. 차례가 가까워지면 3명이 함께 미리 내려와 계세요. 순서를 놓치면 어떻게 되는지는 확인하지 못했어요.
      - 대기가 너무 길면 걸어서 10분 거리의 다른 지점도 있어요. 신광미츠코시 A4관 지하 2층점과 원바이 A13 1층점이 101점보다 덜 붐빈다고 해요.
      - 대기가 많으면 번호표를 일찍 마감해요. 대기 조회 페이지에 번호표 마감 예정 시간이 나와요.
    links:
      - label: 딘타이펑 대기 조회
        href: https://www.dintaifung.tw/Queue/?type=3&s=0007
  - time: "16:40"
    kind: sight
    title: 타이베이 101 전망대
    place: tp101
    meta:
      - 10:00–21:00 · 마지막 입장 20:15
      - 1시간 30분 정도
    desc: 엘리베이터를 타면 37초 만에 89층에 도착해요. 89층 실내 전망대를 한 바퀴 둘러본 다음, 88층에서 건물 흔들림을 잡아 주는 660톤짜리 윈드 댐퍼도 꼭 보세요. 91층 야외 전망대는 날씨가 좋은 날에만 열려요.
    tips:
      - "**89층 일반권 3장을 예매해 뒀어요.** 입장은 16:30–17:00 사이에만 할 수 있어요. 101층까지 올라가고 싶으면 현장에서 NT$380을 더 내면 돼요."
      - "**Skyline 460**은 안전장비를 차고 건물 바깥 460m 높이를 걷는 체험으로, NT$3,000에 예약제이고 키 145cm 이상만 할 수 있어요."
      - 해는 17:35쯤 져요. 17:10쯤 시내 쪽 서쪽 창가에 미리 자리를 잡아 두세요.
  - time: "18:15"
    kind: food
    label: 저녁
    title: 딘타이펑 저녁
    local: 鼎泰豐 101店
    meta:
      - 101 쇼핑몰 지하 1층
    desc: 번호표 순서가 가까워지면 지하 1층으로 내려가세요. 전망대에서 노을과 야경을 보고 내려오면 시간이 잘 맞아요.
    tips:
      - 샤오롱바오(小籠包)와 새우계란볶음밥(蝦仁蛋炒飯), 오이무침(涼拌小黃瓜)은 꼭 시켜 보세요. 트러플 샤오롱바오는 가격이 있는 편이라 맛보기로 한두 개면 충분해요.
      - 주문지에 원하는 메뉴의 수량을 적어 내는 방식이에요. 한국어 주문지도 있으니 직원에게 요청하세요.
  - time: "19:30"
    kind: free
    title: 신이 지구 구경
    local: 信義商圈
    meta:
      - 체력에 따라 골라 보세요
    alts:
      - title: 신이 지구 쇼핑몰
        place: xinyi
        desc: 101과 이어진 육교를 따라 브리즈 난산, 신광미츠코시, 성품서점까지 걸어서 둘러볼 수 있어요. 소화도 시킬 겸 가볍게 걸어 보세요.
      - title: 샹산(코끼리산) 야경
        place: xiangshan
        desc: 샹산역{R02} 2번 출구에서 등산로 입구까지 10분, 계단으로 20분쯤 올라가면 101이 정면으로 보이는 전망 포인트가 나와요. 계단이 가파르니 꼭 운동화를 신으세요.
  - time: "20:30"
    kind: food
    label: 야식
    title: 야시장
    local: 夜市
    meta:
      - 둘 중 하나를 골라요
    alts:
      - title: 린장제(통화) 야시장 · 추천
        place: linjiang
        desc: 101에서 가장 가까운 야시장이에요. 101에서 걸어서 10분, 또는 신이안허역{R04}까지 한 정거장 가서 4번 출구로 나오면 10분이에요. 18:00부터 자정까지 열고, 평일 밤이라 주말보다 덜 붐벼요.
        tips:
          - 따뜻한 깨 경단에 빙수를 얹은 위핀위안 빙훠탕위안(御品元冰火湯圓), 줄 서는 루웨이 량지(梁記滷味), 볶음 요리 뤄지(駱記小炒), 취두부 야커우톈샹(雅口天香臭豆腐)을 드셔 보세요.
          - 돌아갈 때는 신이안허역{R04}에서 레드라인으로 메인역{R10}까지 간 뒤 블루라인으로 갈아타 룽산쓰역{BL10}에서 내리면 돼요.
      - title: 화시제·광저우제 야시장 · 숙소 옆
        place: guangzhou
        desc: 숙소 바로 옆이라 끝나고 걸어서 들어가면 돼서 가장 편해요. 101에서 시정부역{BL18}까지 걸어서 10분, 블루라인으로 갈아타지 않고 룽산쓰역{BL10}까지 한 번에 가요.
        tips:
          - 음식 노점은 대부분 22:00쯤 닫아요. 바삭한 굴전 스자(施家脆皮蚵仔煎)와 오징어 수프 량시하오(兩喜號魷魚羹)는 자정 무렵까지 열어요.
          - 미쉐린 빕구르망 가게(小王煮瓜, 源芳刈包)는 20:00에 닫아서 이 시간에는 갈 수 없어요.
  - time: "22:00"
    move: A 린장제 야시장에서는 신이안허역{R04}에서 레드라인을 타고 메인역{R10}까지 간 뒤 블루라인으로 갈아타 룽산쓰역{BL10}에서 내리세요. 40분쯤 걸려요. B 화시제·광저우제 야시장이라면 숙소까지 걸어서 금방이에요.
  - time: "22:40"
    kind: free
    label: 숙소
    title: 숙소로 돌아와 쉬기
    place: hotel
    desc: 다음 날 투어는 11:40 시먼역 미팅이라 아침은 여유가 있어요. 투어 중에는 비와 산길에 대비해야 하니 우비와 운동화, 멀미약을 미리 꺼내 두세요.
