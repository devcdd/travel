# 하루 일정. 파일 이름 순서가 Day 1, 2, 3 … 이고, 주소는 #/taipei-2026/d1 처럼 돼요.
# stops: kind(meet 집합 · sight 관광 · food 식사 · free 자유) 또는 move(이동 안내 한 줄)
date: "2026-10-07"
short: "101"
title: 타이베이 101에서 일몰부터 야경까지
lead: 도착하는 날이라 일정을 신이 지구 한 곳에 모았어요. 해가 17:40쯤 지니까 16:45 무렵 전망대에 오르면 낮 풍경과 노을, 야경을 한 번에 볼 수 있어요. 밤에는 숙소 옆 룽산쓰에 들렀다가 하루를 마무리하세요.
chips:
  - tone: ok
    text: 확정
facts:
  - label: 지역
    value: 신이(信義), 완화(萬華)
  - label: MRT
    value: "{R03} 타이베이101역"
  - label: 일몰
    value: 17:40 무렵
weather:
  place: tp101
  label: 타이베이
stops:
  - time: 도착
    kind: free
    label: 체크인
    title: 입국하고 숙소 체크인
    place: hotel
    meta:
      - 항공편 시간에 맞춰 조정
      - "{BL10} 룽산쓰역에서 걸어서 3분"
    desc: 타오위안 공항에서 공항철도 직달차를 타면 타이베이 메인역{A1}까지 35분쯤 걸려요. 메인역에서 블루라인으로 갈아타 두 정거장 가면 룽산쓰역{BL10}이고, 숙소는 역에서 걸어서 3분 거리예요. 완화 기차역과 붙어 있어서 찾기 쉬워요.
    tips:
      - 공항 MRT역이나 편의점에서 **이지카드(悠遊卡)**를 사서 충전해 두세요. 지하철, 버스, 편의점 결제까지 여행 내내 이 카드 하나로 해결돼요.
      - 체크인 시간 전에 도착했다면 프런트에 짐만 맡기고 바로 나가셔도 돼요.
  - time: "15:00"
    move: 룽산쓰역{BL10}에서 블루라인을 타고 메인역{BL12}에서 레드라인으로 갈아탄 뒤 타이베이101역{R03}에서 내리세요. 30분쯤 걸려요.
  - time: "15:30"
    kind: food
    label: 이른 저녁
    title: 딘타이펑 101점
    place: dtf101
    meta:
      - 101 쇼핑몰 지하 1층
      - 보통 30분–1시간 대기
    desc: 평일 오후 3–4시는 대기가 가장 짧은 시간이에요. 번호표를 받아 두고 쇼핑몰을 구경하다가 차례가 다가오면 돌아오세요.
    tips:
      - 샤오롱바오(小籠包)와 새우계란볶음밥(蝦仁蛋炒飯), 오이무침(涼拌小黃瓜)은 꼭 시켜 보세요. 트러플 샤오롱바오는 가격이 있는 편이라 맛보기로 한두 개면 충분해요.
      - 주문지에 원하는 메뉴의 수량을 적어 내는 방식이에요. 한국어 주문지도 있으니 직원에게 요청하세요.
  - time: "16:45"
    kind: sight
    title: 타이베이 101 전망대
    place: tp101
    meta:
      - 5층 매표소에서 89층으로
      - 1시간 30분 정도
    desc: 5층에서 엘리베이터를 타면 37초 만에 89층에 도착해요. 89층 실내 전망대를 한 바퀴 둘러본 다음, 87–88층으로 내려가 건물 흔들림을 잡아 주는 660톤짜리 윈드 댐퍼도 꼭 보세요. 91층 야외 전망대는 날씨가 좋은 날에만 열려요.
    tips:
      - 티켓을 사기 전에 **101층까지 올라갈지** 먼저 정하세요. 일반권으로는 89층(약 NT$600)까지 가고, 101층은 인원 제한이 있는 별도 상품이라 가격이 몇 배 비싸요.
      - "**Fast Track**은 줄을 서지 않고 바로 들어가는 우선 입장권이고, **Skyline 460**은 안전장비를 차고 건물 바깥 460m 높이를 걸어 보는 체험이에요. 101층이 포함되는지는 상품마다 다르니 구매 전에 확인하세요."
      - 노을은 시내 쪽 서쪽 창에서 가장 잘 보여요. 17:20쯤 미리 자리를 잡아 두세요.
  - time: "18:30"
    kind: free
    title: 신이 지구 산책 또는 샹산 야경
    local: 信義商圈 · 象山
    meta:
      - 체력에 따라 골라 보세요
    alts:
      - title: 신이 지구 쇼핑몰
        place: xinyi
        desc: 101과 이어진 육교를 따라 브리즈 난산, 신광미츠코시, 성품서점까지 걸어서 둘러볼 수 있어요. 첫날이니 가볍게 구경하며 마무리하기 좋아요.
      - title: 샹산(코끼리산) 야경
        place: xiangshan
        desc: 샹산역{R02} 2번 출구에서 등산로 입구까지 10분, 계단으로 20분쯤 올라가면 101이 정면으로 보이는 전망 포인트가 나와요. 계단이 가파르니 꼭 운동화를 신으세요.
  - time: "21:00"
    kind: sight
    label: 선택
    title: 룽산쓰 야경
    place: longshan
    meta:
      - 숙소에서 걸어서 5분
      - 밤 10시까지 열어요
    desc: 1738년에 세워진, 타이베이에서 가장 오래된 사원이에요. 지붕의 용 장식에 조명이 들어오면 낮보다 훨씬 화려해요. 바로 옆 화시제 야시장까지 걸어서 이어지니 출출하면 야식도 즐겨 보세요.
