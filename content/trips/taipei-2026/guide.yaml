# 명소 이야기 탭. 가는 곳의 유래와 간단한 설명을 날짜별로 모아요. place는 places.yaml의 id예요.
- place: longshan
  day: "10.07"
  body: 1738년 청나라 때 푸젠에서 건너온 이주민들이 고향의 룽산쓰를 본떠 세운 절이에요. 관세음보살을 중심으로 불교와 도교, 민간 신앙의 신들을 함께 모셔서 하루 종일 기도하러 오는 사람들로 붐벼요.
  points:
    - 2차 세계대전 때 폭격으로 본전이 무너졌는데, 관음상만 무사했다는 이야기가 전해져요.
    - 붉은 반달 모양 나무 조각 두 개를 던져 신에게 묻는 점(擲筊)을 보는 것도 재미있어요.
- place: bopiliao
  day: "10.07"
  body: 청나라 때부터 이어진 옛 거리로, 배로 실어 온 통나무 껍질을 벗기던 곳이라 껍질 벗기는 거리라는 뜻의 이름이 붙었다고 해요. 청나라와 일제 강점기의 붉은 벽돌 건물이 잘 남아 있어요.
  points:
    - 2010년 대만 영화 맹갑(艋舺)의 촬영지로 알려졌어요.
- place: tp101
  day: "10.07"
  title: 타이베이 101
  body: 2004년에 문을 연 높이 508m의 빌딩으로, 2010년 두바이의 부르즈 할리파가 생기기 전까지 세계에서 가장 높은 건물이었어요. 대나무 마디처럼 8층씩 8단으로 쌓아 올린 모양이에요.
  points:
    - 87층부터 92층 사이에 지름 5m가 넘는 거대한 쇠공(댐퍼)이 매달려 있어 태풍과 지진 때 건물 흔들림을 줄여 줘요. 전망대에서 직접 볼 수 있어요.
    - 매년 12월 31일 밤 건물 전체에서 터지는 새해 불꽃놀이가 유명해요.
- place: xiangshan
  day: "10.07"
  title: 샹산
  body: 타이베이 동쪽의 네 봉우리 쓰서우산(四獸山) 가운데 하나로, 산 모양이 코끼리를 닮아 코끼리산이라는 이름이 붙었어요. 20분쯤 계단을 오르면 101이 정면으로 보이는 전망 바위가 나와서 야경 명소가 됐어요.
- place: huaxi
  day: "10.07"
  body: 1987년에 대만에서 처음으로 관광 야시장으로 꾸며진 곳이에요. 예전에는 뱀 요리 가게가 모여 있어 뱀 골목으로 불렸는데, 지금은 미쉐린에 오른 루러우판 집 같은 소박한 먹거리 가게가 많아요.
- place: yehliu
  day: "10.08"
  body: 바다로 길게 뻗어 나온 곶에 수천만 년 동안 파도와 바람이 깎아 만든 바위들이 늘어서 있어요. 위는 둥글고 아래는 가는 버섯 바위가 많고, 그중 고개를 든 여왕의 옆모습을 닮은 여왕머리(女王頭)가 가장 유명해요.
  points:
    - 여왕머리는 풍화로 목이 계속 가늘어지고 있어서 언젠가 부러질 수 있다고 해요. 줄이 길면 옆에 있는 비슷한 바위에서 사진을 찍어도 좋아요.
- place: shifenFall
  day: "10.08"
  body: 폭이 40m쯤 되는 커튼 모양의 폭포로, 대만에서 가장 넓은 폭포 가운데 하나라 대만의 나이아가라라고 불려요. 물보라에 햇빛이 비치면 무지개가 자주 떠요.
- place: shifen
  day: "10.08"
  title: 스펀과 천등
  body: 석탄을 실어 나르던 핑시선 기찻길 바로 양옆에 가게가 늘어선 마을이에요. 기차가 오지 않을 때는 선로 위에서 소원을 적은 천등(天燈)을 날려요.
  points:
    - 천등은 삼국시대 제갈량이 군사 신호로 처음 썼다고 해서 쿵밍등(孔明燈)이라고도 불러요.
    - 옛날 산적이 쳐들어오면 마을 사람들이 산으로 피했다가, 위험이 지나가면 천등을 띄워 안전하다고 알렸다는 이야기가 전해져요.
    - 색깔마다 뜻이 달라서 빨간색은 건강, 노란색은 돈, 분홍색은 사랑을 비는 색이라고 해요.
- place: jiufen
  day: "10.08"
  body: 청나라 때 산골에 아홉 가구만 살아서 물건을 들일 때 늘 아홉 몫(九份)을 사 왔다는 데서 이름이 생겼다고 해요. 1890년대에 금이 발견되면서 사람들이 몰려들어 번성했다가 1970년대에 금광이 문을 닫으며 조용해졌어요.
  points:
    - 1989년 영화 비정성시(悲情城市)가 이곳에서 촬영되며 다시 알려졌어요.
    - 붉은 등이 걸린 찻집 아메이차루(阿妹茶樓)가 센과 치히로의 행방불명 배경이라는 말이 있지만, 지브리는 공식적으로 부인했어요.
- place: npm
  day: "10.09"
  body: 베이징 자금성의 황실 소장품으로 1925년에 연 고궁박물원의 유물이 국공내전 때 대만으로 옮겨졌고, 1965년 지금 자리에 박물관이 세워졌어요. 청동기와 도자기, 옥, 서화 등 약 70만 점을 갖고 있어서 한 번에 모두 전시하지 못해 작품을 돌아가며 바꿔 걸어요.
  points:
    - 취옥백채(翠玉白菜)는 청나라 황제의 비가 시집올 때 가져온 혼수품으로 알려져 있어요. 배추 위의 메뚜기와 여치는 자손이 많기를 비는 뜻이에요.
- place: dihua
  day: "10.09"
  title: 디화제와 다다오청
  body: 1850년대부터 단수이강 나루터를 중심으로 번성한 상업 지역이에요. 1860년대 항구가 외국에 열리면서 차와 장뇌 무역의 중심지가 됐고, 그때 지은 바로크풍 상가 건물이 지금도 길을 따라 늘어서 있어요.
  points:
    - 거리 중간의 샤하이 청황묘(霞海城隍廟)는 1859년에 세운 사당으로, 인연을 맺어 준다는 월하노인(月下老人)을 모셔 연애 운을 빌러 오는 사람이 많아요.
    - 설 명절 전에는 건어물과 과자를 사려는 사람들로 거리가 꽉 차는 연말 대목 시장이 열려요.
- place: ximending
  day: "10.09"
  body: 청나라 때 타이베이 성의 서쪽 문(西門) 밖에 있던 땅이에요. 일제 강점기에 일본인들이 극장과 상점을 모은 번화가로 만들었고, 지금은 차 없는 거리에 옷가게와 길거리 음식이 몰린 젊은이들의 거리예요.
  points:
    - 입구의 붉은 벽돌 팔각 건물 시먼훙러우(西門紅樓)는 1908년에 공설 시장으로 지은 건물이에요. 지금은 대만 디자이너들의 소품 가게와 공연장으로 쓰여요.
