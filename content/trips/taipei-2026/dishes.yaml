# 대표 음식 탭. 음식 종류마다 설명과 대표 맛집을 모아요. place는 places.yaml의 id, area는 오른쪽에 작게 보일 동네예요.
- name: 샤오롱바오
  local: 小籠包
  desc: 얇은 피 안에 뜨거운 육즙과 돼지고기 소를 넣고 작은 대나무 찜기에 쪄 내는 만두예요. 상하이 난샹에서 시작했다고 알려져 있어요. 숟가락에 올려 피를 살짝 터서 육즙부터 마신 뒤, 생강채를 올린 식초 소스에 찍어 드시면 돼요.
  spots:
    - place: dtf101
      area: 101 · 10.07 저녁
      note: 첫날 저녁에 가는 곳이에요. 예약 없이 번호표로만 받고 매일 10:45–20:30에 열어요. 6월 22일부터 샤오롱바오 10개가 NT$290으로 올랐어요.
    - place: dtfXinsheng
      area: 둥먼
      note: 2025년과 2026년 미쉐린 빕구르망에 오른 딘타이펑이에요. 길 건너 신이점 본점은 포장만 되니 앉아서 드시려면 이 건물로 가세요. 평일은 11:00–20:30, 주말과 공휴일은 10:30–20:30에 열어요.
    - place: hangzhouXlb
      area: 중정기념당
      note: 2025년과 2026년 미쉐린 빕구르망에 오른 소박한 탕바오 집이에요. 예약을 받지 않고 현금만 받아요. 점심은 11:00–14:30이고, 16:30–21:00에 저녁 영업을 한다는 글도 있지만 확인하지 못했어요.
    - place: jinDinRou
      area: 중산
      note: 중산역에서 걸어서 5–10분 거리예요. 우롱차를 넣은 샤오롱바오가 유명하고 전화로 예약할 수 있다고 해요. 영업시간은 글마다 달라서 확인하지 못했어요.
    - place: dianShuiLou
      area: 메인역 근처
      note: 메인역과 228 평화공원 사이에 있는 레스토랑이에요. 일곱 가지 맛을 한 찜기에 담은 칠채 샤오롱바오(七彩小籠包)가 유명하고, 공식 홈페이지에서 inline 예약으로 넘어갈 수 있어요. 영업시간은 확인하지 못했어요.
      links:
        - label: 공식 홈페이지
          href: https://www.dianshuilou.com.tw/index_location.html
    - place: jinJiYuan
      area: 융캉제
      note: 융캉제의 오래된 만두집이에요. 수요일에 쉬어서 10월 7일에는 갈 수 없어요. 영업시간은 글마다 달라서 확인하지 못했어요.

- name: 우육면
  local: 牛肉麵
  desc: 1949년 이후 대륙에서 건너온 군인 가족들이 정착하면서 대만의 대표 음식이 된 소고기 국수예요. 두반장과 간장으로 붉고 진하게 끓인 홍샤오(紅燒)와 소뼈를 오래 고아 맑게 낸 칭둔(清燉)이 있어요. 처음이라면 홍샤오부터 드셔 보시고, 식탁에 놓인 갓 절임(酸菜)을 넣으면 한결 개운해져요.
  spots:
    - place: laoShandong
      area: 시먼 · 10.10 점심
      note: 마지막 날 점심으로 넣어 둔 곳이에요. 2018년부터 해마다 미쉐린 빕구르망에 오르고 있고, 손으로 썬 넓적한 면에 한약재를 넣은 홍샤오 국물이 특징이에요. 매일 10:30에 열고 현금만 받아요.
    - place: fuhong
      area: 시먼
      note: 시먼딩의 24시간 우육면집이에요. 1년 내내 문을 열고 국물을 더 달라고 하면 채워 줘요. 늦은 밤에 출출할 때 들르기 좋아요.
    - place: niuDian
      area: 시먼
      note: 홍샤오와 칭둔을 둘 다 잘하는 집이에요. 예약을 받지 않아서 번호표를 받고 밖에서 기다려요. 월요일에 쉬고 점심은 11:00–14:00이에요. 저녁 영업시간은 확인하지 못했어요.
    - place: liuShandong
      area: 메인역 근처
      note: 메인역과 베이먼역 사이 골목의 노포예요. 월요일부터 토요일까지 08:00–20:00에 열고 일요일에 쉬어요. 현금만 받아요.
    - place: linDongFang
      area: 중산구
      note: 두반장 없이 소뼈와 채소로 우린 국물에 소기름 고추기름을 곁들여 먹는 집이에요. 11:00부터 새벽 3시까지 열어서 늦은 시간에도 갈 수 있어요.
    - place: tianxia
      area: 다안
      note: 2025년과 2026년 미쉐린 빕구르망에 오른 고급 우육면집이에요. 꼬리와 사태, 힘줄 등 네 부위를 올린 대표 메뉴가 NT$530이에요. 매일 11:30–14:30과 17:30–20:30에 열고 예약을 받아요.
      links:
        - label: 공식 홈페이지
          href: https://www.noodle3.com.tw/
    - place: yongkang
      area: 둥먼
      note: 두반장을 넣어 매콤한 촨웨이(川味) 우육면집이에요. 분증배골(粉蒸排骨)을 곁들이는 사람이 많아요. 올해 영업시간은 확인하지 못했어요.

- name: 루러우판
  local: 滷肉飯
  desc: 잘게 썬 돼지고기를 샬롯과 함께 볶아 간장에 조린 뒤 흰밥에 끼얹어 먹는 대만의 서민 음식이에요. 북부에서는 비계 있는 고기로 진하게, 남부에서는 살코기로 담백하게 만드는 편이에요. 작은 그릇이 NT$30–50 정도라 여러 집을 조금씩 맛보기 좋아요.
  spots:
    - place: xiaoWang
      area: 화시제 · 10.07 점심
      note: 숙소 옆 화시제 야시장 안에 있는 미쉐린 빕구르망 가게예요. 작은 그릇이 NT$35이고, 배추 조림(白菜滷)과 오이절임과 고기를 넣은 맑은 국(清湯瓜仔肉)을 곁들여 먹어요. 09:30–20:00에 열고 화요일에 쉬며 현금만 받아요.
    - place: aYi
      area: 화시제 · 10.07 점심
      note: 샤오왕주과와 거의 붙어 있는 60년 가까이 된 집이에요. 굴을 올린 굴 루러우판(蚵仔滷肉飯)이 가장 유명하고, 매일 11:00–20:00에 열어요. 샤오왕주과 줄이 길 때 바로 갈아타기 좋아요.
    - place: tiantianli
      area: 시먼딩
      note: 시먼딩에서 이름난 루러우판 집이에요. 반숙 달걀 프라이를 올려 터뜨려 비벼 먹는 게 이 집 방식이에요. 화요일부터 일요일까지 10:30–22:30에 열고 월요일에 쉬어요.
    - place: fengyuan
      area: 숙소 근처
      note: 숙소에서 가까운 광저우제의 갈비 튀김 국숫집인데, 달짝지근한 루러우판도 함께 많이 시켜요. 10:30–23:00에 열고 수요일에 쉬어서 10월 7일에는 문을 닫아요.
    - place: jinfeng
      area: 중정기념당
      note: 중정기념당 근처의 오래된 루러우판 집이에요. 루러우판에 조린 달걀을 곁들이면 1인 NT$95 정도예요. 11:00부터 새벽 1시까지 열고 월요일에 쉬어요.
    - place: sanyuan
      area: 닝샤 야시장
      note: 닝샤 야시장 남쪽 끝의 노포예요. 살코기로만 만든 루러우판과 걸쭉한 고기 수프(魚翅肉羹)가 유명하고, 작은 그릇이 NT$30이에요. 09:00–21:00에 열어요.
    - place: dadaochengLrf
      area: 베이먼 근처
      note: 젠청 시장 안에 있는 가게로, 2019년 국경일 국빈 만찬에 이 집 루러우판이 나왔어요. 반숙 달걀을 올려 먹어요. 11:30부터 20:00 무렵까지 열지만 쉬는 날은 글마다 달라서 확인하지 못했어요.
    - place: huangji
      area: 중산궈샤오
      note: 2024년부터 미쉐린 빕구르망에 오른 집이에요. 작은 그릇이 NT$35이고 현금만 받아요. 11:30–20:00에 열고 월요일과 목요일에 쉬어서 10월 8일에는 문을 닫아요.

- name: 꽈바오
  local: 刈包
  desc: 납작한 찐빵을 반으로 접어 간장에 조린 삼겹살과 갓 절임, 땅콩가루, 고수를 넣어 먹는 대만식 버거예요. 호랑이가 돼지를 문 모양이라 호교저(虎咬豬)라고도 불러요. 고수를 싫어하면 주문할 때 不要香菜(부야오 샹차이)라고 말하세요.
  spots:
    - place: yuanfang
      area: 화시제 · 숙소 근처
      note: 숙소 옆 화시제 야시장 입구 쪽, 샤오왕주과 바로 옆 가게예요. 구글 리뷰가 3,000개 가까이 되고, 화요일부터 일요일까지 11:30–20:00에 열어요. 월요일에 쉬어요.
    - place: redBao
      area: 시먼딩
      note: 구글 평점 4.9의 작은 꽈바오 가게예요. 금요일부터 일요일까지 16:30–22:00에만 열어서 이번 여행에서는 10월 9일과 10일 저녁에 갈 수 있어요.
    - place: siliang
      area: 중정기념당
      note: 중정기념당역 2번 출구 근처의 꽈바오 전문점으로 구글 평점 4.6이에요. 평일 11:40–20:00, 토요일 11:40–19:00에 열고 일요일에 쉬어요.
    - place: fuGuabao
      area: 중산
      note: 저녁에만 여는 꽈바오 가게로 구글 평점 4.7이에요. 17:00부터 자정까지 열고 토요일에 쉬어요.
    - place: trueBao
      area: 중산
      note: 구글 평점 4.8의 저녁 꽈바오 가게예요. 17:30부터 자정까지(금요일과 토요일은 새벽 1시까지) 열고 화요일에 쉬어요.
    - place: lanjia
      area: 궁관
      note: 구글 리뷰가 7,000개 넘는 가장 유명한 꽈바오 집이에요. 동선에서는 떨어진 궁관 쪽이고, 화요일부터 일요일까지 11:00–22:00에 열어요.
    - place: shijiaLinjiang
      area: 린장제 야시장 · 10.07
      note: 첫날 들르는 린장제 야시장 안에 있어서 편해요. 10:30부터 새벽 0:30까지 열어요. 구글 평점은 3.3으로 낮은 편이니 줄이 없으면 가볍게 맛보는 정도로 생각하세요.

- name: 훠궈
  local: 火鍋
  desc: 끓는 국물에 고기와 채소, 두부를 익혀 먹는 냄비 요리예요. 대만에서는 얼얼하게 매운 마라 국물과 순한 국물을 반씩 담는 원앙궈(鴛鴦鍋)를 많이 시키고, 국물 속 오리 선지(鴨血)와 두부를 계속 채워 주는 집이 많아요. 봉사료 10%가 따로 붙고 식사 시간이 90–120분으로 정해진 곳이 많으니 들어갈 때 확인하세요. 구글 평점은 리뷰 이벤트 때문에 높게 나오는 곳도 있으니 리뷰 수와 함께 참고하세요.
  spots:
    - place: shuanle
      area: 시먼딩 · 평점 4.9
      note: 와규를 1인 냄비로 즐기는 훠궈집으로 구글 평점 4.9에 리뷰가 2만 개 넘어요. 시먼역 바로 앞 건물 3층이고, 오늘(금) 11:30부터 자정까지 열어요.
    - place: wending
      area: 시먼딩 · 평점 4.8
      note: 한약재를 넣은 마라 국물로 유명한 훠궈 체인으로 구글 평점 4.8에 리뷰가 1만 개 넘어요. 11:30부터 자정까지 열어요.
    - place: cuanniu
      area: 시먼딩 · 평점 4.8
      note: 그날 잡은 신선한 소고기를 맑은 국물에 살짝 데쳐 먹는 타이난식 소고기 훠궈집이에요. 구글 평점 4.8이고 저녁 17:00–23:30에만 열어요.
    - place: rouzhijian
      area: 시먼딩 · 평점 4.8
      note: 큰 접시에 고기를 푸짐하게 내는 훠궈집으로 구글 평점 4.8이에요. 11:30부터 새벽 2시까지 열어요.
    - place: akafuji
      area: 시먼딩 · 평점 4.9
      note: 야키니쿠와 훠궈를 함께 먹는 일본식 가게로 구글 평점 4.9예요. 11:30–23:00에 열어요.
    - place: newMala
      area: 시먼딩 · 평점 4.7
      note: 마라 무한리필 체인으로 시먼딩에만 지점이 여러 개예요. 한중점은 구글 평점 4.7이고 11:30–22:00에 열어요.
    - place: wulao
      area: 시먼딩 · 10.09 저녁
      note: 셋째 날 저녁 1순위로 넣어 둔 곳이에요. 1인 국물값 NT$159에 재료를 따로 시키고, 아이스크림 두부 국물은 NT$189예요. 오리 선지와 두부, 밥은 계속 채워 주고 매일 11:00부터 새벽 4시까지 열어요. 예약과 대기 방법은 먹을 것 탭에 적어 두었어요.
    - place: dingWang
      area: 시먼딩
      note: 한국 연예인들도 즐겨 찾는다고 알려진 마라훠궈 체인이에요. 1인 국물값 NT$160에 재료를 따로 시키고, 테이블마다 최소 NT$650을 시켜야 하며 봉사료 10%가 붙어요. 매일 11:00부터 새벽 2시까지 열어요. 원격 대기는 안 돼서 줄이 길면 가게에서 이름을 올려야 해요.
      links:
        - label: inline 예약
          href: https://inline.app/booking/-LDaBuB5UvBj5xtnOUlH/-LrRtlMWRLdTGwI6CQ-w
    - place: zhanji
      area: 시먼딩
      note: 옛 대세계 극장 건물 지하에 있는 인기 마라훠궈집이에요. 젤리처럼 부드러운 오리 선지와 앵거스 소갈비가 유명해요. 12:00부터 새벽 1시까지 열고, inline에서 예약하거나 가게에 가지 않고 원격 대기를 걸 수 있어요.
      links:
        - label: inline 예약·대기
          href: https://inline.app/booking/-KO9-zyZTRpTH7LNAe99/-NvFDHdbyHM7P2vbgoDP
    - place: mala
      area: 시먼딩
      note: 무한리필 마라훠궈집이에요. 국물 두 가지를 고르면 고기와 하겐다즈 아이스크림까지 마음껏 먹을 수 있어요. 올해 6월 글 기준으로 앵거스 코스가 평일 점심 NT$698, 저녁과 주말, 공휴일은 NT$798이고 현금만 받아요.
    - place: haidilao
      area: 까르푸 구이린점 4층
      note: 마지막 날 기념품을 사러 가는 까르푸 건물 4층에 있는 중국 훠궈 체인이에요. 칸이 넷으로 나뉜 냄비와 면 뽑기 공연으로 유명하고, 11:00부터 새벽 3시까지 열어요.
    - place: chinHuajiao
      area: 중산
      note: 푸른 산초(青花椒)로 얼얼한 맛을 내는 마라훠궈집이에요. 들어가면 산초 차를 내주고, 오리 선지와 두부, 갓 절임을 계속 채워 줘요. 원격 대기를 걸 수 있고 방법은 먹을 것 탭에 적어 두었어요.
    - place: orange
      area: 다안
      note: 와규와 활해산물을 1인 냄비로 즐기는 고급 일본식 샤부샤부집이에요. 매일 11:30–23:00에 열고, 당일 예약이 안 되니 가려면 전날까지 inline으로 예약하세요.

- name: 버블티
  local: 珍珠奶茶
  desc: 카사바 전분으로 만든 쫀득한 타피오카 펄을 밀크티에 넣은 대만 음료예요. 1980년대에 타이중의 춘수당과 타이난의 한린차관이 서로 원조라고 내세웠을 만큼 대만 사람들이 아끼는 음료예요. 주문할 때 당도와 얼음 양을 고르는데, 처음이라면 반만 달게(半糖) 얼음은 적게(少冰)로 시켜 보세요.
  spots:
    - place: chunshuitang
      area: 메인역 앞
      note: 버블티를 처음 만들었다고 내세우는 찻집이에요. 지름 8mm 펄을 삶은 지 3시간 안에만 쓴다고 해요. 신광미쓰코시 역전점 지하 2층에 있고, 일요일부터 목요일까지 11:00–21:30, 금요일과 토요일은 11:00–22:00에 열어요.
    - place: xingfutang
      area: 시먼딩
      note: 흑당 펄을 토치로 그을려 올린 흑당 버블 우유(黑糖珍珠鮮奶)가 대표 메뉴예요. 시먼역 6번 출구에서 걸어서 3분 안쪽이에요. 영업시간은 글마다 달라서 확인하지 못했어요.
    - place: milksha
      area: 시먼딩
      note: 홍차 라테에 펄을 넣은 珍珠大正紅茶拿鐵가 인기인 체인이에요. 시먼딩점은 매일 10:00–22:30에 열어요. 숙소 근처 룽산쓰점과 101 전망대 89층에도 매장이 있다고 공식 매장 목록에 나와요.
    - place: kebuke
      area: 숙소 근처
      note: 숙성 홍차로 유명한 체인이에요. 쫀득한 백옥 펄을 넣은 우유 홍차(白玉歐蕾)가 대표 메뉴예요. 숙소에서 가장 가까운 매장이고, 영업시간은 확인하지 못했어요.
    - place: napTea
      area: 닝샤 야시장
      note: 닝샤 야시장 근처 매장이에요. 흑당 버블 밀크(黑糖珍珠厚奶)가 대표 메뉴이고, 영업시간은 확인하지 못했어요.
    - place: truedan
      area: 스린
      note: 2010년 스린 야시장에서 시작한 흑당 버블 우유 가게예요. 스린다베이점은 월요일부터 목요일까지 11:00–20:00, 금요일부터 일요일까지 11:00–21:00에 열어요.

- name: 빙수
  local: 剉冰
  desc: 곱게 간 얼음에 팥과 녹두, 타피오카 펄, 연유, 제철 과일을 듬뿍 올리는 대만식 빙수예요. 우유를 얼려 눈꽃처럼 얇게 깎은 쉐화빙(雪花冰)도 인기예요. 생망고는 여름이 제철이라 10월에는 냉동 망고를 쓰거나 망고 메뉴가 빠지는 곳이 많으니, 땅콩이나 팥처럼 철을 타지 않는 빙수도 드셔 보세요.
  spots:
    - place: sanxiongmei
      area: 시먼딩
      note: 한국 사람들이 많이 찾는 시먼딩의 망고 눈꽃빙수 집이에요. 한국어 메뉴가 있고, 올해 2월 글 기준으로 망고 빙수가 NT$200–250 정도예요. 망고 철이 아닐 때는 냉동 망고를 쓴다고 해요.
    - place: yangjiIce
      area: 시먼딩
      note: 1961년에 문을 연 땅콩옥수수 빙수 집이에요. 망고와 상관없는 메뉴라 10월에도 제맛이에요. 매일 11:00–22:00에 연다는 2024년 글이 있어요.
    - place: longduIce
      area: 숙소 근처
      note: 1920년에 문을 연 숙소 근처 빙수 노포예요. 여덟 가지 토핑을 올린 팔보빙(八寶冰)이 대표 메뉴예요. 11:30–22:00에 열고 화요일과 수요일에 쉬어서 10월 7일에는 문을 닫아요.
    - place: bingzan
      area: 솽롄역
      note: 냉동 과일을 쓰지 않아서 망고 철에만 여는 집이에요. 올해 망고 눈꽃빙수가 NT$200이고 현금만 받아요. 시즌이 10월 중순에서 하순 사이에 끝나서 이번 여행 때 열려 있을지는 확인하지 못했으니 공식 SNS를 보고 가세요.
    - place: smoothieHouse
      area: 융캉제
      note: 망고 눈꽃빙수로 이름난 융캉제의 빙수 집이에요. 망고 철이 아니면 냉동 망고를 쓴다고 미리 알려 준다고 해요. 월요일부터 목요일까지 10:30–22:00, 금요일과 토요일, 공휴일은 10:30–22:30에 열어요.
    - place: xinfating
      area: 스린 야시장
      note: 스린 야시장의 오래된 빙수 집으로, 얇게 깎은 눈꽃 얼음(雪片冰)에 팥을 올려 먹어요. 영업시간은 글마다 달라서 확인하지 못했어요.
    - place: bingfeng
      area: 시먼딩
      note: 구글 평점 4.6에 리뷰가 3,000개 넘는 시먼딩 빙수 집이에요. 매일 12:00–22:00에 열어요. 10월에 생망고를 쓰는지는 확인하지 못했어요.
    - place: youzai
      area: 디화제 · 10.09
      note: 디화제 남쪽 입구에 있어서 다다오청을 걷다 들르기 좋아요. 구글 평점 4.4이고, 10:30부터 17:30(화요일과 주말은 18:00)까지 열어요.
    - place: huoshi
      area: 중산
      note: 중산역 뒤 츠펑제 골목의 디저트 가게로 구글 평점 4.3에 리뷰가 1,400개 넘어요. 평일 13:00–21:00, 주말 12:30–21:00에 열어요.
    - place: chunmei
      area: 쑹산
      note: 구글 리뷰가 3,000개 넘는 빙수 집으로 매일 12:00–21:00에 열어요. 동선에서는 조금 떨어져 있어요.
    - place: agangyi
      area: 지우펀 · 10.08 저녁
      note: 지우펀에서 들를 타로볼 가게예요. 토란과 고구마 경단에 팥과 녹두를 올려 차갑게도 따뜻하게도 먹을 수 있어요. 창가 자리 경치가 좋고 현금만 받아요.

- name: 카스테라
  local: 古早味蛋糕
  desc: 대만식 카스테라는 큰 판에 구워 바로 잘라 파는 옛날식 스펀지케이크(古早味現烤蛋糕)예요. 계란과 우유가 많이 들어가 폭신하고 촉촉해서, 막 구워 나온 따뜻한 걸 사 먹는 게 가장 맛있어요. 원조 맛에 치즈를 넣은 것도 많아요.
  spots:
    - place: yuanyuanCake
      area: 시먼딩
      note: 시먼딩에서 바로 사 먹기 좋은 곳이에요. 구글 평점 4.8이고 매일 15:00–22:30에 열어서 저녁에 들르기 좋아요.
    - place: shuanglianCake
      area: 솽롄 · 10.09
      note: 구글 리뷰가 400개 넘는 갓 구운 카스테라 집이에요. 디화제에서 가까워 셋째 날 오후에 들르기 좋아요. 10:00–20:30에 열고 일요일에 쉬어요.
    - place: shuangheCake
      area: 숙소 남쪽
      note: 숙소에서 남쪽으로 650m쯤 떨어진 동네 카스테라 집이에요. 구글 평점 4.4이고 화요일부터 일요일까지 09:00–18:30에 열어요. 월요일에 쉬어요.
    - place: jimeiCake
      area: 중정기념당
      note: 중정기념당 근처의 작은 가게예요. 15:00–20:00에 열고 일요일에 쉬어요.
    - place: aileCake
      area: 101 근처
      note: 101에서 남쪽으로 850m쯤 떨어진 가게로 구글 평점 4.7이에요. 매일 11:00–20:00에 열어요.

- name: 펑리수
  local: 鳳梨酥
  desc: 버터 반죽 안에 파인애플 잼을 넣어 구운 과자로, 대만 기념품으로 가장 많이 사 가요. 파인애플에 동아(冬瓜)를 섞어 달고 부드러운 것과 파인애플만 넣어 새콤하고 결이 씹히는 투펑리수(土鳳梨酥)가 있으니 상자 설명을 보고 고르세요.
  spots:
    - place: chiate
      area: 쑹산
      note: 2006년 타이베이 펑리수 축제에서 1등을 한 집이에요. 파인애플에 동아를 섞은 부드러운 맛이고, 2024년 기준으로 원조 맛 6개가 NT$216이에요. 매일 08:30–20:30에 열어요.
    - place: sunnyhills
      area: 101 · 공항
      note: 파인애플만 넣은 새콤한 펑리수로 유명해요. 6개 NT$345, 10개 NT$550이에요. 101 지하 1층과 타오위안 공항 1터미널 1층 출국 심사 전(07:00–19:30)에도 매장이 있어서 첫날이나 마지막 날 사기 좋아요.
    - place: vigor
      area: 시먼딩
      note: 시먼딩과 메인역 지하, 공항에 매장이 많은 체인이에요. 기본 펑리수는 파인애플과 동아를 반씩 넣었고, 파인애플만 넣은 황금 펑리수(黃金鮮果鳳梨酥)도 있어요. 시먼 우창점은 10:00–21:30에 열어요.
    - place: sugarSpice
      area: 시먼딩
      note: 누가로 유명한 과자점인데 펑리수도 함께 팔아요. 클래식 펑리수 8개가 NT$304이고 101 지하 1층에도 매장이 있어요. 영업시간은 확인하지 못했어요.
    - place: kuoYuanYe
      area: 스린역 · 10.09
      note: 스린역 1번 출구 근처의 오래된 과자점으로, 4층에 과자 박물관이 있어요. 고궁박물원 가는 길에 들를 수 있고 노른자를 넣은 펑황수(鳳黃酥)도 있어요. 매장 영업시간은 확인하지 못했어요.
    - place: carrefour
      area: 숙소 근처 · 10.10 오전
      note: 마지막 날 아침에 들르는 대형 마트예요. 온라인 상품 목록에 웨이거와 이메이(義美) 펑리수가 있지만 이 매장에 있는지는 확인하지 못했어요. 대만 까르푸가 이름을 완자푸(萬家福)로 바꿔서 간판이 다를 수 있어요.

- name: 한식
  local: 韓式料理
  desc: 대만 음식이 입에 안 맞거나 매운 국물이 그리울 때 갈 만한 한식당이에요. 시먼딩에 한식당이 많이 모여 있고, 무한리필 집은 봉사료 10%가 따로 붙고 식사 시간이 90–110분으로 정해져 있어요. 대부분 대만 매체 글을 보고 골라서, 가기 전에 지도에서 영업 중인지 한 번 확인하세요.
  spots:
    - place: dongdaemun
      area: 시먼딩
      note: 한국인 부부가 운영하는 집으로, 투어 쿠폰북에 있는 그 가게예요. 쿠폰을 보여 주면 소주 한 병을 준다고 해요. 2024년 글 기준으로 제육볶음 정식이 1인 NT$399이고, 매일 11:00–24:00에 열어요. 예약은 전화(02-2331-5582)로 해요.
    - place: gangneung
      area: 시먼딩
      note: 순두부찌개 무한리필 집이에요. 국물 다섯 가지와 치킨, 전 같은 반찬 30가지쯤을 마음껏 먹고, 어른 1인 NT$498에 봉사료 10%가 붙어요. 일요일부터 목요일까지 11:00–22:00, 금요일과 토요일은 22:30까지 열고 90분 제한이에요.
    - place: bokjjim
      area: 시먼딩
      note: 강릉할매와 같은 건물 4층의 닭볶음탕 무한리필 집이에요. 1인 NT$399부터이고 봉사료 10%가 붙으며 100분 제한이에요. 전화(02-2375-5580)로 예약할 수 있어요.
    - place: busanSundubu
      area: 시먼딩
      note: 30년 가까이 운영한 순두부 집이에요. 해물 순두부와 해물파전, 오징어볶음이 있고, 11:00–22:00에 열어요. 쉬는 날과 가격은 확인하지 못했어요.
    - place: meatStorage
      area: 시먼딩
      note: 동대문 바로 아래층의 한국식 고기 무한리필 집이에요. 월요일부터 목요일까지 1인 NT$688, 금요일부터 일요일까지 NT$888이고 봉사료 10%가 붙어요. 영업시간은 확인하지 못했어요.
    - place: ajeoma
      area: 메인역
      note: 메인역 옆 브리즈 타이베이역 2층의 고기 무한리필 집이에요. 평일 점심은 NT$569, 평일 저녁과 주말은 NT$629이고 10:00–22:00에 열어요. 가격은 2024년 무렵 글 기준이에요.
    - place: samiBibimbap
      area: 중산
      note: 중산역 4번 출구에서 걸어서 5분 거리의 돌솥비빔밥 집이에요. 갈비 돌솥비빔밥과 된장찌개가 있어요. 점심과 저녁 사이에 쉬는 시간이 있고, 정확한 시간은 확인하지 못했어요.
    - place: meatLove
      area: 101 근처
      note: 참나무 숯불에 두꺼운 삼겹살과 와규를 직원이 구워 주는 고깃집이에요. 1인 최소 NT$600에 봉사료 10%가 붙고 110분 제한이에요. 전화나 OpenTable로 예약할 수 있어요.
    - place: sinchon
      area: 시정부역
      note: 서서 먹는 한국식 갈빗집으로 갈매기살과 이베리코 삼겹살이 대표 메뉴예요. 1인 최소 NT$390이고 봉사료는 없어요. 예약 없이 가고 현금이나 LINE Pay로 내요.

- name: 대만 차
  local: 台灣茶
  desc: 대만은 우롱차가 유명해요. 해발 1,000m가 넘는 산에서 자란 고산차(高山茶)는 꽃향기가 나고 쓴맛이 적고, 작은 벌레가 찻잎을 갉아 먹은 뒤 꿀 같은 향이 나는 동방미인(東方美人)도 대만에서만 나는 차예요. 앉아서 우려 마시는 찻집과 찻잎을 사 가는 가게가 있으니 목적에 맞게 고르세요.
  spots:
    - place: liuyu
      area: 룽산쓰역 지하
      note: 룽산쓰 지하상가에 있는 앉아서 마시는 찻집이에요. 고산차와 동방미인, 귀비우롱을 우려 주고 말린 과일과 간식을 곁들여 내요. 주인이 영어를 해요. 영업시간은 공식 출처가 없어서 확인하지 못했어요.
    - place: fulldone
      area: 숙소 근처
      note: 1845년 멍자(艋舺)에서 시작해 6대째 이어 오는 찻잎 가게예요. 대바구니에 숯불로 덖은 숙성 우롱과 철관음을 시음해 보고 살 수 있어요. 10:00–19:30에 열고, 일요일은 예약제라는 안내가 공식 홈페이지에 있어요.
    - place: dongxian
      area: 숙소 근처
      note: 동과차(冬瓜露)와 옛날식 홍차를 파는 포장 음료 가게예요. 21:00에 닫는 것까지만 확인했고 여는 시간은 확인하지 못했어요.
    - place: twTreasureCd
      area: 시먼딩
      note: 1907년에 시작한 찻잎 가게로 고산 우롱과 둥딩 우롱, 오래 묵힌 노차를 팔아요. 시음 공간이 있어서 맛보고 고를 수 있어요. 영업시간은 확인하지 못했어요.
    - place: twTreasureHk
      area: 시먼딩
      note: 청두점과 같은 가게의 시먼딩 한커우점이에요. 영업시간은 확인하지 못했어요.
    - place: yaoyang101
      area: 101 · 10.07
      note: 1842년 루강에서 시작한 찻잎 가게로, 철제 틴에 담은 선물용 차가 예뻐요. 101 지하 1층에 있어 첫날 들르기 편하고, 앉아서 마시는 자리는 없어요.
    - place: halfday
      area: 디화제 · 10.09
      note: 디화제 옛집을 고친 찻집으로 직접 덖은 대만 차를 우려 줘요. 도자기 가게 안쪽을 지나 들어가야 해서 찾기 어려우니 지도를 보고 가세요. 10:00–18:30에 연다는 글이 있어요.
    - place: stopBy
      area: 융캉제
      note: 다기가 가득한 앉아서 마시는 찻집으로, 바닥 아래로 물길이 흐르는 다실이 있어요. 13:00에 열고 20:00나 21:00에 닫는다는 글이 엇갈려요.
    - place: qingtian
      area: 다안
      note: 1930년에 지은 일본식 목조 주택을 고친 찻집이에요. 차 1인분이 NT$450–1,600이고 1인 물값 NT$200이 따로 붙어요. 매일 10:00–18:00에 열고 예약할 수 있어요.
