- title: 우라오 시먼딩점
  local: 無老鍋
  day: "10.09"
  desc: 마라탕과 백탕을 반반으로 즐기는 훠궈집이에요. 숙소에서 한 정거장이고, 1인 NT$500–1,500 정도예요. 휴일 저녁이라 inline으로 예약해 두는 게 가장 확실해요.
  order: 반반 냄비와 아이스크림 두부는 꼭 시켜 보세요.
  wait:
    remote: false
    steps:
      - 원격 대기는 안 돼요. 2층 카운터에 가서 이름과 인원, 휴대폰 번호를 알려 주고 대기를 걸어요.
      - 대기가 걸리면 inline이 문자로 대기 현황 링크를 보내 주고, 자리가 나면 자동 음성 전화나 문자로 알려 줘요.
      - 한국 번호로 문자나 전화가 오는지는 확인하지 못했어요. 카운터에서 얼마나 기다려야 하는지 물어보고 가게 근처에 계세요.
  place: wulao
  links:
    - label: inline 예약
      href: https://inline.app/booking/-LDaH7X_NGlrM_Vr0Kj9/-LVCMCC4w-HLsDWli57b
- title: 삼미식당
  local: 三味食堂
  day: "10.09"
  desc: 시먼딩의 큼직한 연어 초밥집이에요. 예약을 받지 않고, 저녁은 17:10에 문을 열어요.
  order: 연어 초밥과 연어 덮밥을 시켜 보세요.
  wait:
    remote: false
    steps:
      - 문 열기 1시간쯤 전부터 가게 앞에 명단이 놓여요. 전화번호와 인원을 적어 두세요.
      - 17:10에 문을 열면 가게 앞에서 적은 순서대로 불러요. 전화로는 불러 주지 않아요.
      - 부를 때 자리에 없으면 다시 줄을 서야 하니 멀리 가지 마세요.
  place: sunway
