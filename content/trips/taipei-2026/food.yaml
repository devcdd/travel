# 먹을 것 탭. day는 배치한 날(예: "10.07", 수시), place는 places.yaml의 id예요.
- title: 자옌 (숙소 3층)
  local: 家宴
  day: "10.07"
  desc: 숙소 3층의 광둥·상하이 요리 식당이에요. 홍콩식 딤섬으로 이름났고, 점심은 11:30–14:30이에요. TableCheck나 전화(02-2383-6798)로 예약할 수 있고, 10월 6일에 봤을 때는 7일 점심 자리가 남아 있었어요.
  order: 캐비아 사오마이와 새우 두부피말이를 시켜 보세요.
  wait:
    remote: true
    href: https://www.tablecheck.com/ko/caesar-metro-jiayan/waitlist
    steps:
      - 예약이 꽉 찼다면 TableCheck 원격 대기 페이지에서 인원과 연락처를 넣고 대기를 걸어요. 가게 근처에 있지 않아도 걸 수 있어요.
      - 대기가 걸리면 문자가 오고, 자리가 나면 입장 문자가 한 번 더 와요. 그때부터 10분 안에 가야 하고, 늦으면 자동으로 취소돼요.
      - 원격 대기는 가게가 열어 둔 시간에만 걸 수 있어요. 한국 번호로 문자가 오는지는 확인하지 못했으니 이메일도 함께 적어 두세요.
  place: jiayan
  links:
    - label: TableCheck 예약
      href: https://www.tablecheck.com/ko/caesar-metro-jiayan/reserve/landing
- title: 딘타이펑 101점
  local: 鼎泰豐
  day: "10.07"
  desc: 샤오롱바오 하면 떠오르는 바로 그 집이에요. 대만에서는 예약을 받지 않아서, 도착하면 번호표부터 받고 기다려야 해요. 101점은 10:45–20:30에 열고, 대기가 많으면 번호표를 일찍 마감해요.
  order: 샤오롱바오와 새우계란볶음밥, 오이무침을 함께 시켜 보세요.
  wait:
    remote: false
    href: https://www.dintaifung.tw/Queue/?type=3&s=0007
    steps:
      - 번호표는 매장에서만 받을 수 있어요. 101점 지하 1층에서 3명 번호표를 받아 두세요.
      - 순서 보기 페이지에서 3–4인 칸의 호출 번호를 내 번호표와 비교하면 순서가 어디까지 왔는지 알 수 있어요. 한국어로 나오고, 예상 대기 시간과 번호표 마감 예정 시간도 보여 줘요.
      - 번호가 가까워지면 3명이 함께 매장으로 가세요. 일행이 모두 와야 자리를 안내해 줘요.
  place: dtf101
