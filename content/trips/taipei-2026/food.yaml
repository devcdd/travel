  desc: 시먼딩 입구의 거위 고기 노포예요. 국수 NT$60에 거위 고기 NT$100–200이고, 회전이 빨라요.
  order: 거위 고기 한 접시에 쌀국수를 곁들여 보세요.
  place: duckHouse
- title: 칭화자오 중산북점
  local: 青花驕
  day: 수시
  desc: 산초가 얼얼한 마라 훠궈집이에요. 맵기를 소·중·대로 고를 수 있고, 1인 NT$700–800 정도예요.
  wait:
    remote: true
    href: https://inline.app/-MaXEQcbiWaRjXyLytUu:inline-live-2/-MaXER3I3tbJ6YWZIFGu/waiting
    steps:
      - 대기는 당일에만 걸 수 있어요. 점심은 11:30–16:00, 저녁은 17:00–22:00 사이에 대기 걸기 페이지를 여세요. 가게 근처에 있지 않아도 돼요.
      - 오늘 점심이나 저녁 버튼(我要今日午餐/晚餐)을 누르고 인원과 이름, 휴대폰 번호를 넣어요. 번호 앞의 +886을 눌러 +82로 바꾸세요.
      - 確認候位를 누르면 대기 번호와 앞에 남은 팀 수가 나오는 페이지로 넘어가요. 한국 번호로 문자가 오는지는 확인하지 못했으니 이 페이지를 열어 두세요.
      - 차례가 되면 保留候位를 누르고 가게로 가세요. 가게가 대기를 닫아 두거나 그날 대기가 다 차면 걸 수 없어요.
  place: chinHuajiao
  links:
    - label: inline 예약
      href: https://inline.app/booking/-MaXEQcbiWaRjXyLytUu:inline-live-2/-MaXER3I3tbJ6YWZIFGu
