  place: buil
- title: 두일막국수
  day: 10.18 대안
  desc: 통메밀을 그때그때 빻아서 뽑는 메밀 함량 높은 막국수집이에요. 2026 블루리본 전국판에 올라 있고, 부일식당에서 차로 7분쯤 걸려요. Google 지도 기준으로 매일 10:00–20:00 열어요.
