# 먹을 것 탭. 일정에 넣은 식당이에요. day는 가는 날, place는 places.yaml의 id예요.
- title: 황태회관
  day: "10.17"
  desc: 첫날 늦은 점심이에요. 직접 덕장을 운영하는 30년 넘은 황태 전문점이고 2026 블루리본 전국판에 올라 있어요. 황태 요리에 기본 반찬이 10가지쯤 나오고, 국물은 더 달라고 할 수 있어요. Google 지도 기준으로 매일 07:00–22:00 열어요.
  order: 황태구이정식을 시키면 황태해장국이 함께 나와요.
  wait:
    remote: true
    href: https://app.catchtable.co.kr/ct/shop/hwangtaehoegwan
    steps:
      - 캐치테이블에서 원격 웨이팅을 걸 수 있어요. 다만 대기가 2팀 이상일 때만 열려서, 한산하면 바로 들어가면 돼요.
      - 대관령IC를 나오기 전쯤 캐치테이블에서 대기 팀 수를 보고, 줄이 있으면 미리 웨이팅을 걸어 두세요.
  place: hwangtae
- title: 납작식당
  day: 10.17 대안
  desc: 오삼불고기의 원조로 불리는 50년 넘은 집이에요. 블루리본 2개를 받았고 2026 전국판에 올라 있어요. 큼지막한 오징어를 써서 씹는 맛이 좋고 고추장 양념이 맵지 않아요. Google 지도 기준으로 점심은 11:30–15:00, 저녁은 17:00–21:00이에요. 블루리본에는 화요일에 쉰다고 나와 있어요.
  order: 오삼불고기를 시키고 남은 양념에 밥을 볶아 드세요.
  wait:
    remote: false
    steps:
      - 캐치테이블에 입점하지 않아서 원격 웨이팅이 안 돼요. 가게에 가서 직접 기다려야 해요. 테이블링과 네이버 원격줄서기는 확인하지 못했어요.
  place: napjak
- title: 부일식당
  day: "10.18"
  desc: 둘째 날 점심이에요. 60년 넘게 산채백반을 내 온 집으로 블루리본 2개를 받았고 2026 전국판에 올라 있어요. 가마솥에 장작을 때서 밥을 짓고 직접 만든 두부와 산나물 반찬이 한 상 가득 나와요. 문 닫는 시간은 Google 지도에는 21:00, 블루리본에는 20:00으로 달라요.
  order: 산채백반에 더덕구이를 추가하는 걸 블루리본이 추천해요.
  wait:
    remote: false
