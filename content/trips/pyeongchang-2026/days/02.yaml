date: "2026-10-18"
short: 귀가
title: 카페 들렀다 집으로
lead: 숙소에서 아침을 먹고 11시까지 체크아웃해요. 카페 후보 세 곳 중 한 곳에 들르고, 서울로 가는 길에 있는 진부에서 블루리본 식당으로 점심을 먹은 뒤 돌아가요. 일요일 오후라 올라가는 길이 막힐 수 있으니 너무 늦지 않게 출발하세요.
chips:
  - tone: idea
    text: 카페 3곳 중 고르기
  - tone: ok
    text: 점심 블루리본
  - tone: warn
    text: 일요일 상행 정체
facts:
  - label: 체크아웃
    value: "11:00까지"
  - label: 운전
    value: 막히지 않으면 2시간 30분쯤
stops:
  - time: "오전"
    kind: food
    label: 아침
    title: 숙소에서 아침
    place: hotel
    desc: 전날 장 봐 둔 걸로 간단히 먹어요.
  - time: "11:00"
    kind: free
    label: 체크아웃
    title: 모나용평 체크아웃
    place: hotel
  - time: "11:15"
    kind: food
    label: 카페
    title: 카페 들르기
    desc: 세 곳 중 한 곳을 골라요. A와 B는 숙소 가까이에 있고, C는 서울로 가는 길에 있는 진부라 들렀다가 바로 진부IC로 올라갈 수 있어요.
    tips:
      - 영업시간은 Google 지도 기준이에요. 가기 전에 한 번 더 확인하세요.
    alts:
      - title: 카페 6.55
        place: cafe655
        desc: 숙소에서 차로 7분쯤 걸려요. 일요일에는 10:00–18:00 열어요. Google 리뷰가 37개로 많지 않아서 분위기는 확인하지 못했어요.
      - title: 7HUNDRED coffee roasters
        place: sevenHundred
        desc: 횡계 시내에 있는 로스터리 카페예요. 숙소에서 차로 9분쯤 걸리고 매일 08:00–20:00 열어요. Google 리뷰가 450개가 넘어요.
      - title: 연월일
        place: yeonwolil
        desc: 진부면에 있는 카페로 숙소에서 차로 20분쯤 걸리고 매일 09:00–21:30 열어요. 서울로 가는 방향이라 들렀다 가기 좋아요.
  - time: "12:15"
    move: 카페에서 진부까지 차로 20분쯤 가요. C 연월일에 갔다면 5분이면 도착해요.
  - time: "12:30"
    kind: food
    label: 점심
    title: 진부에서 점심
    meta:
      - 블루리본 2026
    desc: 진부는 서울로 가는 길이라 돌아가지 않아도 돼요. 두 곳 모두 블루리본 2026 전국판에 올라 있어요.
    alts:
      - title: 부일식당
        place: buil
        desc: 60년 넘게 산채백반을 내 온 집이고 블루리본 2개를 받았어요. 손님이 올 때마다 가마솥에 장작을 때서 밥을 짓고, 직접 만든 두부와 산나물 반찬이 한 상 가득 나와요. 더덕구이를 곁들이는 걸 블루리본이 추천해요.
        tips:
          - Google 지도에는 매일 08:00–21:00, 블루리본에는 20:00에 문을 닫는다고 나와 있어요. 점심에 가면 시간은 걱정하지 않아도 돼요.
      - title: 두일막국수
        place: duil
        desc: 통메밀을 그때그때 빻아서 면을 뽑는 막국수집으로 닭백숙도 내요. 부일식당에서 차로 7분쯤 북쪽에 있고 Google 지도 기준으로 매일 10:00–20:00 열어요.
  - time: "13:45"
    move: 진부IC에서 영동고속도로를 타고 에그옐로우쇼핑몰 주차장으로 돌아가요. 막히지 않으면 2시간 20분쯤 걸리지만 일요일 오후 상행은 한두 시간 더 걸릴 수 있어요.
  - time: "오는 길"
    kind: free
    label: 휴게소
    title: 휴게소에서 쉬어 가기
    desc: 서울로 오는 방향 휴게소 세 곳이에요. 점심을 진부에서 먹고 출발하니 정체가 길어질 때 쉬어 가기 좋은 곳을 고르세요. 이동 시간은 막히지 않을 때 기준이에요.
    tips:
      - 메뉴는 기사와 후기에 소개된 것이고, 지금도 파는지와 가격은 확인하지 못했어요.
    alts:
      - title: 평창휴게소 인천방향
        place: restPyeongchangW
        desc: 진부에서 10분쯤 거리라 점심 뒤에 화장실만 들르기 좋아요.
      - title: 횡성휴게소 인천방향
        place: restHoengseongW
        desc: 진부에서 40분쯤 걸려요. 횡성 한우 메뉴로 알려진 휴게소예요.
      - title: 경기광주휴게소 서울방향
        place: restGwangjuS
        desc: 광주원주고속도로로 돌아올 때 서울 들어가기 전 마지막 큰 휴게소로, 진부에서 1시간 30분쯤 걸려요. 정체가 심하면 여기서 한 번 쉬었다 가세요.
  - time: "20:00까지"
    kind: meet
    label: 반납, 해산
    title: 쏘카 반납하고 해산
    place: socar
    desc: 빌린 주차장에 차를 세우고 앱에서 반납해요. 반납 전에 두고 내린 짐이 없는지 확인하세요. 서울대입구역이 걸어서 3분 거리예요.
