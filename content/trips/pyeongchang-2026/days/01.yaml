date: "2026-10-17"
short: 출발
title: 봉천역 집결, 양떼목장 보고 숙소로
lead: 10시에 봉천역에서 모여 아침을 먹고 11시쯤 출발해요. 체크인이 15시부터라 대관령에 먼저 들러 늦은 점심을 먹고 양떼목장을 본 뒤, 횡계 시내 마트에서 장을 보고 숙소로 들어가요.
chips:
  - tone: warn
    text: 날짜 미정
  - tone: ok
    text: 양떼목장 예매 완료
facts:
  - label: 집결
    value: "10:00 봉천역"
  - label: 운전
    value: 막히지 않으면 2시간 40분쯤
  - label: 체크인
    value: "15:00부터"
stops:
  - time: "10:00"
    kind: meet
    label: 집결
    title: 봉천역에서 모이기
    place: bongcheon
    desc: 다 모이면 역 근처에서 아침을 먹고 11시쯤 출발해요. 아침 먹을 곳은 아직 정하지 않았어요.
  - time: "11:00"
    move: 봉천역에서 영동고속도로를 타고 대관령IC로 나가요. 막히지 않으면 2시간 40분쯤 걸리지만 토요일 오전이라 3시간 넘게 걸릴 수 있으니 휴게소에서 한 번 쉬어 가세요.
  - time: "14:00"
    kind: food
    label: 늦은 점심
    title: 황태회관
    place: hwangtae
    meta:
      - 대관령IC에서 가까운 횡계 시내
      - 매일 07:00–22:00
    desc: 대관령은 황태 덕장으로 유명한 곳이라 황태해장국이나 황태구이를 먹어 보세요. 브레이크 타임 없이 하루 종일 열어서 도착 시간이 늦어져도 괜찮아요.
    tips:
      - 영업시간은 Google 지도 기준이에요. 휴게소에서 점심을 먹었다면 건너뛰고 바로 목장으로 가세요.
    alts:
      - title: 납작식당
        place: napjak
        desc: 오삼불고기로 알려진 집이에요. 점심은 15:00까지, 저녁은 17:00부터라 14:30 전에 들어가야 해요.
  - time: "15:00"
    move: 횡계 시내에서 옛 대관령휴게소 쪽으로 차로 15분쯤 가요.
  - time: "15:15"
    kind: sight
    title: 대관령 양떼목장
    place: sheep
    meta:
      - 예매 완료 (1인 9,000원)
      - 매표 09:00–16:30
    desc: 능선을 따라 울타리 안 산책로를 한 바퀴 돌면서 풀을 뜯는 양들을 보고, 끝에서 건초 주기 체험을 해요. 한 시간에서 한 시간 반쯤 잡으면 돼요.
    tips:
      - 매표가 16:30에 끝나니 그 전에 도착해야 해요.
      - 대관령은 서울보다 훨씬 쌀쌀하고 바람이 세요. 겉옷을 꼭 챙기세요.
  - time: "16:30"
    move: 목장에서 횡계 시내로 차로 12분쯤 돌아와요.
  - time: "16:45"
    kind: free
    label: 장보기
    title: 하나로마트 대관령농협
    place: hanaro
    meta:
      - 매일 08:30–21:00
    desc: 저녁과 다음 날 아침에 먹을 거리, 마실 것을 사요. 숙소 근처에는 큰 마트가 없어서 여기서 다 사 가는 게 좋아요.
    tips:
      - 영업시간은 Google 지도 기준이에요. 숙소 방이 호텔동이면 취사가 안 되니 조리하지 않아도 되는 음식으로 사세요.
    alts:
      - title: 제이마트 대관령점
        place: jmart
        desc: 하나로마트에서 차로 3분 거리이고 22:00까지 열어요.
  - time: "17:30"
    move: 마트에서 숙소까지 차로 10분쯤 걸려요.
  - time: "17:45"
    kind: meet
    label: 체크인
    title: 모나용평 체크인
    place: hotel
    desc: 체크인하고 장 봐 온 걸로 저녁을 먹어요.
