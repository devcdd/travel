date: "2026-10-17"
short: 출발
title: 봉천역 집결, 양떼목장 보고 숙소로
lead: 9시에 봉천역 2번 출구에서 모여 아침을 먹고, 서울대입구역 앞 에그옐로우쇼핑몰 주차장으로 옮겨서 쏘카를 받아 11시쯤 출발해요. 체크인이 15시부터라 대관령에 먼저 들러 늦은 점심을 먹고 양떼목장을 본 뒤, 횡계 시내 마트에서 장을 보고 숙소로 들어가요.
chips:
  - tone: ok
    text: 양떼목장 예매 완료
facts:
  - label: 집결
    value: "09:00 봉천역 2번 출구"
  - label: 차
    value: "10:30 쏘카 대여"
  - label: 운전
    value: 막히지 않으면 2시간 40분쯤
  - label: 체크인
    value: "15:00부터"
stops:
  - time: "09:00"
    kind: meet
    label: 집결
    title: 봉천역 2번 출구에서 모이기
    place: bongcheon
    desc: 다 모이면 근처에서 아침을 먹어요. 아침 먹을 곳은 아직 정하지 않았어요. 차는 10:30부터 받을 수 있어서 시간 여유가 있어요.
  - time: "10:15"
    move: 봉천역에서 에그옐로우쇼핑몰 주차장까지는 1km쯤 떨어져 있어서 걸어서 15분쯤 걸려요. 짐이 많으면 2호선을 타고 한 정거장 가서 서울대입구역에서 내리면 돼요.
  - time: "10:45"
    kind: meet
    label: 차 대여
    title: 쏘카 받기
    place: socar
    desc: 에그옐로우쇼핑몰 주차장은 서울대입구역에서 걸어서 3분쯤 거리예요. 대여가 10:30부터예요. 출발하기 전에 차 상태를 사진으로 찍어 두세요.
  - time: "11:00"
    move: 주차장에서 경부고속도로와 광주원주고속도로를 지나 영동고속도로로 갈아타고 대관령IC로 나가요. 막히지 않으면 2시간 40분쯤 걸리지만 토요일 오전이라 3시간 넘게 걸릴 수 있어요. 내비가 다른 길을 안내하면 아래 휴게소를 지나지 않을 수 있어요.
  - time: "가는 길"
    kind: free
    label: 휴게소
    title: 휴게소에서 쉬어 가기
    desc: 가는 방향 휴게소 세 곳이에요. 한 곳을 골라 화장실에 들르고 간식을 사세요. 점심을 횡계에서 먹을 거라 휴게소에서는 가볍게만 먹는 게 좋아요. 이동 시간은 막히지 않을 때 기준이에요.
    tips:
      - 메뉴는 기사와 후기에 소개된 것이고, 지금도 파는지와 가격은 확인하지 못했어요.
    alts:
      - title: 경기광주휴게소 원주방향
        place: restGwangjuW
        desc: 광주원주고속도로에 있고 출발해서 50분쯤 걸려요. 출발하고 얼마 안 돼서 화장실만 들르기 좋아요.
      - title: 횡성휴게소 강릉방향
        place: restHoengseongE
        desc: 출발해서 1시간 40분쯤 걸려 중간 지점이에요. 횡성 한우를 쓴 한우 떡더덕스테이크가 영동고속도로 별미로 자주 소개되는데, 하루에 파는 양이 정해져 있다는 후기가 있어요.
      - title: 평창휴게소 강릉방향
        place: restPyeongchangE
        desc: 대관령IC 앞 마지막 휴게소로 출발해서 2시간 10분쯤 걸려요. 황태해장국과 한우불고기비빔밥처럼 평창 재료를 쓴 메뉴가 소개돼 있어요.
  - time: "14:00"
    kind: food
    label: 늦은 점심
    title: 횡계 시내에서 점심
    meta:
      - 블루리본 2026
    desc: 대관령IC에서 나오면 바로 횡계 시내예요. 두 곳 모두 블루리본 2026 전국판에 올라 있어요. 오른쪽 위 체크박스로 고른 곳만 지도에 표시할 수 있어요.
    tips:
      - 영업시간은 Google 지도 기준이에요. 휴게소에서 점심을 먹었다면 건너뛰고 바로 목장으로 가세요.
    alts:
      - title: 황태회관
        place: hwangtae
        desc: 직접 덕장을 운영하는 30년 넘은 황태 전문점이에요. 황태구이정식을 시키면 황태해장국이 함께 나와요. 매일 07:00–22:00 브레이크 타임 없이 열어서 도착이 늦어져도 괜찮아요. 대기가 2팀 이상이면 캐치테이블로 원격 웨이팅을 걸 수 있어요.
      - title: 납작식당
        place: napjak
        desc: 오삼불고기 원조로 불리는 집이고 블루리본 2개를 받았어요. 점심은 15:00까지, 저녁은 17:00부터라 14:30 전에 들어가야 해요.
  - time: "15:00"
    move: 횡계 시내에서 옛 대관령휴게소 쪽으로 차로 15분쯤 가요.
  - time: "15:15"
    kind: sight
    title: 대관령 양떼목장
    place: sheep
    meta:
      - 예매 완료 (1인 9,000원)
      - 매표 09:00–16:30
    desc: 능선을 따라 울타리 안 산책로를 한 바퀴 돌면서 풀을 뜯는 양들을 보고, 끝에서 건초 주기 체험을 해요. 한 시간에서 한 시간 반쯤 잡으면 돼요.
    tips:
      - 매표가 16:30에 끝나니 그 전에 도착해야 해요.
      - 대관령은 서울보다 훨씬 쌀쌀하고 바람이 세요. 겉옷을 꼭 챙기세요.
  - time: "16:30"
    move: 목장에서 횡계 시내로 차로 12분쯤 돌아와요.
  - time: "16:45"
    kind: free
    label: 장보기
    title: 횡계 시내에서 장보기
    desc: 저녁과 다음 날 아침에 먹을 거리, 마실 것을 사요. 숙소 근처에는 큰 마트가 없어서 횡계에서 다 사 가는 게 좋아요.
    tips:
      - 영업시간은 Google 지도 기준이에요. 숙소 방이 호텔동이면 취사가 안 되니 조리하지 않아도 되는 음식으로 사세요.
    alts:
      - title: 하나로마트 대관령농협
        place: hanaro
        desc: 매일 08:30–21:00 열어요.
      - title: 제이마트 대관령점
        place: jmart
        desc: 하나로마트에서 차로 3분 거리이고 매일 08:30–22:00 열어요.
  - time: "17:30"
    move: 마트에서 숙소까지 차로 10분쯤 걸려요.
  - time: "17:45"
    kind: meet
    label: 체크인
    title: 모나용평 체크인
    place: hotel
    desc: 체크인하고 장 봐 온 걸로 저녁을 먹어요.
