# 대표 음식 탭. 일정 밖에서 동선에 들르기 좋은 곳까지 블루리본 2026 전국판 식당을 음식별로 모았어요.
# area는 동선에서의 위치예요. 영업시간은 Google 지도 기준이에요.
- name: 오삼불고기
  desc: 오징어와 삼겹살을 고추장 양념에 함께 볶아 먹는 대관령 명물이에요. 횡계 시내에 오래된 집이 모여 있어요. 다 먹은 뒤 남은 양념에 밥을 볶아 먹는 게 정석이에요.
  spots:
    - place: napjak
      area: 횡계 시내, 첫날 점심 대안
      note: 오삼불고기 원조로 불리는 집이에요. 블루리본 2개를 받았어요. 점심은 15:00에 끝나고 저녁은 17:00부터예요.
    - place: dosam
      area: 횡계 시내
      note: 1층이 정육점이고 2층이 식당이에요. 블루리본 1개를 받았고 오삼불고기에 배추가 푸짐하게 들어가요. 식사로는 황탯국을 추천해요. 주말에는 11:30–21:00 열어요.

- name: 황태
  desc: 대관령은 겨울바람에 명태를 얼렸다 녹였다 하며 말리는 황태 덕장으로 유명해요. 뽀얗게 우린 황태해장국과 양념을 발라 구운 황태구이가 대표 메뉴예요.
  spots:
    - place: hwangtae
      area: 횡계 시내, 첫날 점심
      note: 직접 덕장을 운영하는 30년 넘은 집이에요. 블루리본 1개를 받았고 07:00–22:00 쉬지 않고 열어요.

- name: 한우 구이
  desc: 대관령 한우는 고랭지에서 키워 육질이 좋다고 알려져 있어요. 횡계 시내에 고깃집이 몰려 있어서 첫날 저녁을 숙소에서 해 먹지 않는다면 장 보는 길에 들르기 좋아요.
  spots:
    - place: yongpyeongHoegwan
      area: 횡계 시내, 마트 근처
      note: 용평 스키어들 사이에 유명한 집이에요. 블루리본 2개를 받았어요. 등심과 차돌박이, 주물럭이 있고 칼칼한 생태찌개도 유명해요. 주말에는 11:30–21:00 열어요.
    - place: sutbul
      area: 횡계 시내, 마트 근처
      note: 얼리지 않은 대관령 한우 등심을 내요. 블루리본 1개를 받았어요. 생태찌개도 별미예요. 주말에는 11:30–22:00 열어요.
    - place: busanSikyuk
      area: 횡계 시내
      note: 돌판에 소고기를 구워 먹는 60년 된 고깃집이에요. 블루리본 1개를 받았어요. 냉이를 넣은 된장찌개가 별미예요. 주말에는 11:00–23:00 열어요.

- name: 산채정식
  desc: 오대산 자락에서 뜯은 산나물로 한 상을 차리는 강원도 밥상이에요. 나물과 두부, 된장찌개, 황태구이가 함께 나오는 집이 많아요.
  spots:
    - place: buil
      area: 진부, 둘째 날 점심
      note: 가마솥 장작밥을 짓는 60년 넘은 집이에요. 블루리본 2개를 받았어요.
    - place: odaesanSikdang
      area: 횡계 시내
      note: 산채 정식을 시키면 16가지 나물에 더덕구이, 떡갈비, 생선구이까지 한 상 가득 나와요. 블루리본 1개를 받았어요. 주말에는 09:00–21:00 열어서 둘째 날 아침을 사 먹을 때도 좋아요.
    - place: gamasot
      area: 월정사 입구, 진부에서 차로 12분
      note: 월정사 입구 식당촌에서 30년 넘게 산채 요리를 낸 집이에요. 블루리본 1개를 받았어요. 30가지쯤 되는 반찬에 황태구이와 된장찌개가 함께 나와요. 주말에는 08:00–20:00 열어요.

- name: 막국수
  desc: 메밀로 뽑은 면을 동치미나 고기 육수에 말아 먹는 강원도 국수예요. 메밀 함량이 높을수록 면이 툭툭 끊기고 구수해요.
  spots:
    - place: duil
      area: 진부, 둘째 날 점심 대안
      note: 통메밀을 그때그때 빻아 면을 뽑아요. 블루리본 1개를 받았어요.
    - place: yucheon
      area: 숙소에서 진부 가는 길
      note: 한우 뼈를 곤 국물에 동치미 국물을 섞은 육수가 특징이에요. 블루리본 1개를 받았어요. 숙소에서 차로 20분쯤 걸리고 주말에는 10:30–20:00 열어요.

- name: 닭백숙과 곤드레밥
  desc: 토종닭을 푹 고아 낸 백숙과 말린 곤드레나물을 넣고 지은 곤드레밥이에요. 백숙은 시간이 걸리니 미리 전화로 주문해 두면 좋아요.
  spots:
    - place: sangol
      area: 숙소에서 차로 15분
      note: 닭백숙과 오리백숙 전문점이에요. 블루리본 1개를 받았고 토종닭이라 육질이 쫄깃해요. 날이 좋으면 밖에서 먹을 수 있어요. 주말에는 09:00–21:00 열어요.
    - place: chueotang
      area: 횡계 시내 동쪽, 양떼목장 가는 길
      note: 마당에 풀어 키운 닭을 감자와 함께 압력솥에 고아 내요. 블루리본 1개를 받았고 추어탕도 유명해요. 주말에는 11:00–21:00 열어요.
    - place: seongju
      area: 진부, 두일막국수 옆
      note: 곤드레밥을 내는 집으로 가게 앞에 계곡이 흘러요. 블루리본 1개를 받았어요. 주말에는 11:00–18:00까지만 열어요.

- name: 커피와 빵
  desc: 일정에 넣은 카페 후보 세 곳은 블루리본에 올라 있지 않아요. 숙소 안에서 블루리본에 이름이 올라 있는 카페는 이곳이에요.
  spots:
    - place: coffeeM
      area: 숙소 안, 발왕산 케이블카 매표소 옆
      note: 모나베이커리와 함께 운영하는 카페로 블루리본에 이름이 올라 있지만 리본은 없어요. 아메리카노가 추천 메뉴예요. 블루리본에는 18:00에 닫는다고 나와 있어요. 체크아웃 전에 들르기 좋아요.
