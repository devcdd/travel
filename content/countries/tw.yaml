# 대만 공통 정보. 대만 여행이라면 trip.yaml에 country: tw 로 연결하세요.
name: 대만
timeZone: Asia/Taipei
lang: zh-TW
currency:
  code: TWD
  symbol: NT$
  quick: [50, 100, 200, 350, 600, 1000]
taxi:
  ask: 請帶我到

# 본문에 {BL10}처럼 쓰는 노선 코드. 글자 부분이 아래 키와 맞아야 해요.
lines:
  R: { name: 단수이신이선, color: "#e3002c" }
  BL: { name: 반난선, color: "#0070bd" }
  G: { name: 쑹산신뎬선, color: "#008659" }
  O: { name: 중허신루선, color: "#f8b61c", text: "#2a1d00" }
  BR: { name: 원후선, color: "#c48c31" }
  Y: { name: 환상선, color: "#fedb00", text: "#2a1d00" }
  A: { name: 타오위안 공항철도, color: "#8246af" }

# 현지 정보 탭. group이 같은 항목끼리 묶여요. body는 짧은 설명, points는 한 문장씩 끊어 보여줄 내용이에요.
info:
  - group: 돈과 결제
    title: 이지카드 (悠遊卡)
    points:
      - 공항 MRT역 서비스 카운터나 편의점에서 **NT$100**에 살 수 있어요. 이 돈은 카드값이라 나중에 돌려받지 못해요.
      - 한 사람에 한 장씩 있어야 해요. 한 카드로 여러 명이 찍고 들어갈 수 없어요.
      - 충전은 MRT역 충전기나 편의점 계산대에서 **현금으로** 해요.
      - MRT와 버스는 물론 편의점과 일부 택시에서도 결제할 수 있어요. 남은 돈은 마지막 날 공항 편의점에서 쓰고 오세요.
  - group: 돈과 결제
    title: 현금과 카드
    points:
      - 백화점과 체인점에서는 카드를 쓸 수 있지만, 야시장과 오래된 식당, 일부 택시는 현금만 받아요.
      - 팁은 주지 않아도 돼요. 대신 앉아서 먹는 식당은 계산서에 봉사료 10%가 붙는 경우가 많아요.
      - 지폐는 NT$100이 가장 쓰기 좋아요. 야시장에서 NT$1,000짜리를 내면 거스름돈이 없다고 할 때가 있어요.
  - group: 돈과 결제
    title: 세금 환급
    body: 退稅(Tax Refund) 표시가 있는 가게에서 하루에 NT$2,000 넘게 샀다면 여권을 보여 주고 환급 서류를 받으세요. 가게에서 바로 돌려주는 곳도 있고, 출국할 때 공항에서 받는 곳도 있어요.
  - group: 교통
    title: MRT 타는 법
    points:
      - 길찾기는 Google 지도의 대중교통 경로가 정확해요. 노선 색과 {BL10} 같은 역 번호를 보고 타면 헷갈리지 않아요.
      - 시내 요금은 한 번에 NT$20–65 정도예요.
      - 에스컬레이터에서는 오른쪽에 서고, 왼쪽은 걸어 올라가는 사람에게 비워 주세요.
      - 진한 파란색 **우선석(博愛座)**은 비어 있어도 앉지 않는 게 현지 분위기예요.
      - 승강장 바닥에 표시된 줄을 따라 양옆으로 서서 기다리고, 내리는 사람이 다 내린 뒤에 타요.
  - group: 교통
    title: 택시
    points:
      - 노란색 택시는 기본요금이 NT$85(처음 1.25km)이고, 200m마다 NT$5씩 올라요. 밤 11시부터 아침 6시까지는 NT$20이 더 붙어요.
      - 3명이 함께 움직이면 가까운 거리는 MRT와 비슷하거나 더 싸게 나올 때도 있어요.
      - 기사님께는 이 페이지의 **택시 카드**를 보여 주세요. Uber로 부르면 목적지를 말하지 않아도 돼요.
  - group: 꼭 지켜야 할 규칙
    title: MRT 안에서는 아무것도 먹지 않기
    body: 개찰구 안쪽부터는 물, 음료, 껌, 사탕도 안 돼요. 걸리면 **NT$1,500–7,500** 벌금이에요. 몸이 안 좋아 물이나 약을 먹어야 하면 역무원에게 먼저 말하세요.
  - group: 꼭 지켜야 할 규칙
    title: 고기가 들어간 음식은 가져가지 않기
    body: 아프리카돼지열병 때문에 육포, 소시지, 고기 만두, 고기 건더기가 든 라면 같은 음식을 들고 입국하면 처음 걸려도 **NT$200,000** 벌금이에요. 외국인이 그 자리에서 내지 못하면 입국을 거부당해요. 한국에서 간식을 챙길 때 성분을 꼭 확인하세요.
  - group: 꼭 지켜야 할 규칙
    title: 전자담배와 가열담배는 가져가지 않기
    body: 대만은 액상 전자담배를 전면 금지하고, 아이코스 같은 가열담배도 해외에서 들고 들어갈 수 없어요. 입국할 때 걸리면 벌금이 **NT$50,000부터** 시작해요. 일반 담배는 정해진 흡연 구역에서만 피우세요.
  - group: 꼭 지켜야 할 규칙
    title: 쓰레기와 꽁초는 아무 데나 버리지 않기
    body: 타이베이에서 쓰레기나 담배꽁초를 길에 버리면 **NT$3,600** 이상 벌금이에요. 거리에 쓰레기통이 많지 않으니 작은 비닐봉투를 들고 다니다가 편의점이나 MRT역 쓰레기통에 버리세요.
  - group: 알아 두면 편한 것
    title: 전기
    body: 110V에 11자 모양 A타입 콘센트를 써요. 휴대폰 충전기는 대부분 프리볼트라 돼지코 어댑터만 있으면 돼요.
  - group: 알아 두면 편한 것
    title: 물과 편의점
    points:
      - 수돗물은 끓여서 드세요. 생수는 골목마다 있는 세븐일레븐과 패밀리마트에서 언제든 살 수 있어요.
      - 편의점 비닐봉투는 돈을 받아요. 장바구니나 작은 가방을 하나 들고 다니면 편해요.
      - 편의점 화장실은 없는 곳이 많아요. 급할 때는 MRT역 화장실이 가장 깨끗하고 찾기 쉬워요.
  - group: 알아 두면 편한 것
    title: 길 건널 때
    body: 오토바이가 아주 많고 우회전 차량이 횡단보도로 바로 들어올 때가 있어요. 초록불이어도 양옆을 한 번 더 보고 건너세요.
  - group: 알아 두면 편한 것
    title: 시차
    body: 한국보다 1시간 느려요. 이 페이지의 시간은 모두 대만 현지 시각이에요.

emergency:
  - { label: 경찰, number: "110" }
  - { label: 구급차·소방, number: "119" }
  - { label: 관광 안내(24시간), number: 0800-011-765 }

apps:
  - group: 지도 · 교통
    name: Google 지도
    must: true
    ios: "585027354"
    desc: 대만에서는 지하철과 버스 실시간 정보가 정확해서 길찾기는 이 앱 하나면 충분해요. 출발 전에 숙소를 저장하고, 다닐 지역을 오프라인 지도로 받아 두세요.
  - group: 지도 · 교통
    name: Bus+
    store: Bus+ (公車動態)
    ios: "967861325"
    desc: 버스가 언제 도착하는지 실시간으로 알려 줘요. 정류장에서 기다리는 시간을 줄일 수 있어요.
  - group: 지도 · 교통
    name: Uber
    must: true
    ios: "368677368"
    desc: 한국 카드로 바로 택시를 부를 수 있고, 목적지를 지도에서 찍으면 돼서 말이 통하지 않아도 괜찮아요. 짐이 많은 공항 이동에도 편해요.
  - group: 지도 · 교통
    name: 55688 台灣大車隊
    store: 대만 최대 택시 호출 앱
    ios: "579255069"
    desc: Uber가 잘 잡히지 않을 때 쓰는 대만 택시 앱이에요. 화면이 중국어라서, 주소는 이 페이지의 택시 카드에서 복사해 붙여 넣으세요.
  - group: 예약 · 결제
    name: KKday
    ios: "1248267356"
    desc: 투어나 입장권을 KKday로 예약했다면 바우처를 앱에서 바로 보여 줄 수 있어요.
  - group: 예약 · 결제
    name: Klook
    ios: "961850126"
    desc: 투어나 입장권을 Klook으로 예약했다면 이 앱을 받으세요. KKday와 Klook 중 예약한 쪽 하나만 있으면 돼요.
  - group: 예약 · 결제
    name: inline
    store: 설치하지 않아도 돼요
    web: https://inline.app
    desc: 대만 식당 예약과 원격 대기는 웹에서도 할 수 있어서 앱을 받지 않아도 돼요. 일정에 있는 예약 버튼을 눌러 주세요.
  - group: 예약 · 결제
    name: 트래블월렛
    ios: "1460769945"
    desc: 대만 달러를 미리 충전해 두면 카드 결제와 현지 ATM 인출에 쓸 수 있어요. 수수료 조건은 앱에서 확인하세요.
  - group: 예약 · 결제
    name: 트래블로그
    store: 하나머니
    ios: "1038288833"
    desc: 하나카드 트래블로그를 쓰신다면 이 앱에서 대만 달러를 충전하세요.
  - group: 번역 · 소통
    name: 파파고
    must: true
    ios: "1147874819"
    desc: 메뉴판이나 안내문을 카메라로 비추면 바로 번역해 줘요. 번체 중국어도 잘 알아봐요.
  - group: 번역 · 소통
    name: Google 번역
    ios: "414706506"
    desc: 파파고 대신 쓸 수 있어요. 중국어(번체) 오프라인 언어팩을 받아 두면 인터넷이 안 될 때도 번역할 수 있어요.
  - group: 번역 · 소통
    name: LINE
    ios: "443904275"
    desc: 대만에서 가장 많이 쓰는 메신저예요. 식당이나 숙소에 문의할 때 LINE으로 연락하는 경우가 많아요.
  - group: 안전 · 날씨
    name: 해외안전여행
    store: 외교부
    ios: "1469501110"
    desc: 현지 안전 공지를 받아 보고 영사콜센터에 바로 연결할 수 있어요. 여권 분실 같은 일에 대비해 받아 두세요.
  - group: 안전 · 날씨
    name: 中央氣象署W
    store: 대만 기상청 공식 앱
    ios: "439181175"
    desc: 비구름 레이더와 태풍 경보를 가장 빨리 확인할 수 있어요. 여름부터 가을까지는 태풍이 잦으니 가끔씩 확인해 보세요.

# 대만 여행이면 늘 챙길 항목. 여행별 checklist.yaml 뒤에 붙어요.
checklist:
  - id: c-passport
    title: 여권 유효기간
    desc: 한국 여권은 90일까지 무비자지만, 입국하는 날 기준으로 유효기간이 6개월 넘게 남아 있어야 해요.
    due: 출발 전
    group: 출발 전에 할 일
  - id: c-arrival
    title: 대만 온라인 입국신고서
    desc: 이민서 사이트(twac.immigration.gov.tw)에서 작성해요. 종이 신고서가 없어졌고, 작성하고 72시간 안에 입국해야 하니 출발 2–3일 전에 하세요.
    due: 출발 전
    group: 출발 전에 할 일
  - id: c-cash
    title: 대만 달러 현금
    desc: 야시장, 오래된 식당, 천등 가게는 현금만 받아요. NT$100짜리 지폐를 넉넉히 챙기세요.
    due: 출발 전
    group: 출발 전에 할 일
  - id: c-plug
    title: 11자 돼지코 어댑터
    desc: 대만은 110V에 11자 모양 콘센트를 써서 한국 플러그가 그대로 꽂히지 않아요.
    due: 출발 전
    group: 짐 챙기기
  - id: c-powerbank
    title: 보조배터리는 기내 가방에
    desc: 부치는 짐에는 넣을 수 없고, 기내에서 쓰거나 충전할 수 없어요. 선반 대신 좌석 앞에 두고, 단자는 테이프로 막거나 비닐에 하나씩 넣어 가세요.
    due: 출발 전
    group: 짐 챙기기
  - id: c-no-meat
    title: 고기 든 간식 빼기
    desc: 육포, 소시지, 고기 건더기가 든 라면은 대만에 들고 갈 수 없어요. 걸리면 NT$200,000 벌금이에요.
    due: 출발 전
    group: 짐 챙기기
  - id: c-card
    title: 이지카드 사서 충전하기
    desc: 공항 MRT역 서비스 카운터나 편의점에서 1인 1장씩 사세요. 지하철, 버스, 편의점 결제에 두루 쓰여요.
    due: 도착하면
    group: 여행 중에

# 회화 탭. say는 성조를 뺀 한글 발음이에요.
phrases:
  - group: 인사와 기본
    ko: 안녕하세요
    local: "你好"
    say: 니하오
  - group: 인사와 기본
    ko: 감사합니다
    local: "謝謝"
    say: 씨에시에
  - group: 인사와 기본
    ko: 천만에요
    local: "不客氣"
    say: 부커치
  - group: 인사와 기본
    ko: 실례합니다
    local: "不好意思"
    say: 뿌하오이쓰
    note: 미안하다고 할 때도, 사람을 부르거나 길을 비켜 달라고 할 때도 두루 써요.
  - group: 인사와 기본
    ko: 죄송합니다
    local: "對不起"
    say: 뚜이부치
  - group: 인사와 기본
    ko: 잘 가요
    local: "掰掰"
    say: 빠이빠이
    note: 대만에서는 再見(짜이찌엔)보다 이 말을 더 자주 써요.
  - group: 인사와 기본
    ko: 네, 좋아요
    local: "好"
    say: 하오
  - group: 인사와 기본
    ko: 괜찮아요, 필요 없어요
    local: "不用"
    say: 부용
    note: 봉투나 영수증이 필요 없을 때 쓰면 돼요.
  - group: 인사와 기본
    ko: 저는 한국 사람이에요
    local: "我是韓國人"
    say: 워 스 한궈런
  - group: 인사와 기본
    ko: 중국어를 못해요
    local: "我不會說中文"
    say: 워 부후이 쒀 중원
  - group: 인사와 기본
    ko: 잠깐만요
    local: "等一下"
    say: 덩이샤
  - group: 인사와 기본
    ko: 말씀 좀 물을게요
    local: "請問"
    say: 칭원
    note: 무언가를 물어보기 전에 앞에 붙이면 공손해져요.
  - group: 식당에서
    ko: 몇 분이세요?
    local: "幾位?"
    say: 지웨이
    note: 식당에 들어가면 가장 먼저 듣는 말이에요.
  - group: 식당에서
    ko: 세 명이요
    local: "三位"
    say: 싼웨이
  - group: 식당에서
    ko: 자리 있어요?
    local: "有位子嗎?"
    say: 여우 웨이쯔 마
  - group: 식당에서
    ko: 얼마나 기다려야 해요?
    local: "要等多久?"
    say: 야오 덩 뚸지우
  - group: 식당에서
    ko: 먹고 갈게요
    local: "內用"
    say: 네이용
    note: 가게에서 먹고 갈지 포장할지 물으면 이렇게 답해요.
  - group: 식당에서
    ko: 포장이요
    local: "外帶"
    say: 와이따이
  - group: 식당에서
    ko: 메뉴판 주세요
    local: "請給我菜單"
    say: 칭 게이워 차이딴
  - group: 식당에서
    ko: 한국어 메뉴판 있어요?
    local: "有韓文菜單嗎?"
    say: 여우 한원 차이딴 마
