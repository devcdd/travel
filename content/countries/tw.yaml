# 대만 공통 정보. 대만 여행이라면 trip.yaml에 country: tw 로 연결하세요.
name: 대만
timeZone: Asia/Taipei
lang: zh-TW
currency:
  code: TWD
  symbol: NT$
  quick: [50, 100, 200, 350, 600, 1000]
taxi:
  ask: 請帶我到

# 본문에 {BL10}처럼 쓰는 노선 코드. 글자 부분이 아래 키와 맞아야 해요.
lines:
  R: { name: 단수이신이선, color: "#e3002c" }
  BL: { name: 반난선, color: "#0070bd" }
  G: { name: 쑹산신뎬선, color: "#008659" }
  O: { name: 중허신루선, color: "#f8b61c", text: "#2a1d00" }
  BR: { name: 원후선, color: "#c48c31" }
  Y: { name: 환상선, color: "#fedb00", text: "#2a1d00" }
  A: { name: 타오위안 공항철도, color: "#8246af" }

info:
  - title: 교통
    body: 대부분의 장소는 MRT로 갈 수 있어요. Google 지도의 대중교통 길찾기가 정확하고, Uber와 택시도 저렴한 편이에요.
  - title: MRT 이용 규칙
    body: 개찰구 안에서는 물, 껌, 음식을 모두 먹을 수 없고 벌금도 커요. 에스컬레이터에서는 오른쪽에 서 주세요.
  - title: 전기
    body: 110V에 11자 모양 A타입 콘센트를 써요. 휴대폰 충전기는 대부분 프리볼트라 돼지코 어댑터만 있으면 돼요.
  - title: 결제
    body: 백화점과 체인점에서는 카드를 쓸 수 있지만, 야시장과 오래된 식당, 일부 택시는 현금만 받아요. 팁은 따로 주지 않아도 돼요.
  - title: 물과 편의점
    body: 수돗물은 끓여서 드세요. 세븐일레븐과 패밀리마트가 골목마다 있어서 생수는 언제든 살 수 있어요.
  - title: 시차
    body: 한국보다 1시간 느려요. 이 페이지의 시간은 모두 대만 현지 시각이에요.

emergency:
  - { label: 경찰, number: "110" }
  - { label: 구급차·소방, number: "119" }
  - { label: 관광 안내(24시간), number: 0800-011-765 }

apps:
  - group: 지도 · 교통
    name: Google 지도
    must: true
    ios: "585027354"
    desc: 대만에서는 지하철과 버스 실시간 정보가 정확해서 길찾기는 이 앱 하나면 충분해요. 출발 전에 숙소를 저장하고, 다닐 지역을 오프라인 지도로 받아 두세요.
  - group: 지도 · 교통
    name: Bus+
    store: Bus+ (公車動態)
    ios: "967861325"
    desc: 버스가 언제 도착하는지 실시간으로 알려 줘요. 정류장에서 기다리는 시간을 줄일 수 있어요.
  - group: 지도 · 교통
    name: Uber
    must: true
    ios: "368677368"
    desc: 한국 카드로 바로 택시를 부를 수 있고, 목적지를 지도에서 찍으면 돼서 말이 통하지 않아도 괜찮아요. 짐이 많은 공항 이동에도 편해요.
  - group: 지도 · 교통
    name: 55688 台灣大車隊
    store: 대만 최대 택시 호출 앱
    ios: "579255069"
    desc: Uber가 잘 잡히지 않을 때 쓰는 대만 택시 앱이에요. 화면이 중국어라서, 주소는 이 페이지의 택시 카드에서 복사해 붙여 넣으세요.
  - group: 예약 · 결제
    name: KKday
    ios: "1248267356"
    desc: 투어나 입장권을 KKday로 예약했다면 바우처를 앱에서 바로 보여 줄 수 있어요.
  - group: 예약 · 결제
    name: Klook
    ios: "961850126"
    desc: 투어나 입장권을 Klook으로 예약했다면 이 앱을 받으세요. KKday와 Klook 중 예약한 쪽 하나만 있으면 돼요.
  - group: 예약 · 결제
    name: inline
    store: 설치하지 않아도 돼요
    web: https://inline.app
    desc: 대만 식당 예약과 원격 대기는 웹에서도 할 수 있어서 앱을 받지 않아도 돼요. 일정에 있는 예약 버튼을 눌러 주세요.
  - group: 예약 · 결제
    name: 트래블월렛
    ios: "1460769945"
    desc: 대만 달러를 미리 충전해 두면 카드 결제와 현지 ATM 인출에 쓸 수 있어요. 수수료 조건은 앱에서 확인하세요.
  - group: 예약 · 결제
    name: 트래블로그
    store: 하나머니
    ios: "1038288833"
    desc: 하나카드 트래블로그를 쓰신다면 이 앱에서 대만 달러를 충전하세요.
  - group: 번역 · 소통
    name: 파파고
    must: true
    ios: "1147874819"
    desc: 메뉴판이나 안내문을 카메라로 비추면 바로 번역해 줘요. 번체 중국어도 잘 알아봐요.
  - group: 번역 · 소통
    name: Google 번역
    ios: "414706506"
    desc: 파파고 대신 쓸 수 있어요. 중국어(번체) 오프라인 언어팩을 받아 두면 인터넷이 안 될 때도 번역할 수 있어요.
  - group: 번역 · 소통
    name: LINE
    ios: "443904275"
    desc: 대만에서 가장 많이 쓰는 메신저예요. 식당이나 숙소에 문의할 때 LINE으로 연락하는 경우가 많아요.
  - group: 안전 · 날씨
    name: 해외안전여행
    store: 외교부
    ios: "1469501110"
    desc: 현지 안전 공지를 받아 보고 영사콜센터에 바로 연결할 수 있어요. 여권 분실 같은 일에 대비해 받아 두세요.
  - group: 안전 · 날씨
    name: 中央氣象署W
    store: 대만 기상청 공식 앱
    ios: "439181175"
    desc: 비구름 레이더와 태풍 경보를 가장 빨리 확인할 수 있어요. 여름부터 가을까지는 태풍이 잦으니 가끔씩 확인해 보세요.

# 대만 여행이면 늘 챙길 항목. 여행별 checklist.yaml 뒤에 붙어요.
checklist:
  - id: c-arrival
    title: 대만 온라인 입국신고서
    desc: 출발 전에 온라인으로 작성해 두면 입국 심사가 빨라져요. 한국 여권은 90일까지 무비자예요.
    due: 출발 전
  - id: c-cash
    title: 대만 달러 현금
    desc: 야시장, 오래된 식당, 천등 가게는 현금만 받아요. 동전과 NT$100짜리 지폐를 넉넉히 챙기세요.
    due: 출발 전
  - id: c-plug
    title: 11자 돼지코 어댑터
    desc: 대만은 110V에 11자 모양 콘센트를 써서 한국 플러그가 그대로 꽂히지 않아요.
    due: 출발 전
  - id: c-card
    title: 이지카드 사서 충전하기
    desc: 공항 MRT역이나 편의점에서 살 수 있어요. 지하철, 버스, 편의점 결제에 두루 쓰여요.
    due: 도착하면
